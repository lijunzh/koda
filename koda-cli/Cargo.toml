[package]
name = "koda-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Koda, an AI coding agent for the terminal on macOS and Linux: the koda command, with its TUI, headless runs and a client protocol"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["ai", "coding-agent", "llm", "cli", "unix"]
categories = ["command-line-utilities", "development-tools", "asynchronous"]
authors.workspace = true

[[bin]]
name = "koda"
path = "src/main.rs"

# Reads the log database, as Codex's `logs_client` reads its own.
[[bin]]
name = "koda-logs"
path = "src/bin/koda_logs.rs"

[dependencies]
# Koda's host and the client protocol: `koda exec` and `koda serve` reach
# the engine only through these, never `koda-core`
# (scripts/check_tui_core_boundary.sh).
koda-client = { workspace = true }
# The TUI, which `koda` opens by default.
koda-tui = { workspace = true }
# `--oss`: a local model on llama.cpp, started and stopped with Koda.
koda-oss = { workspace = true }
# `--worktree`: a managed worktree, as Codex makes one.
koda-git = { workspace = true }
# Only for `dispatch_helpers` in `main`: `koda` also runs the Linux
# sandbox's stage 2, as Codex's binary runs its sandbox helpers.
koda-sandbox = { workspace = true }
# ugrep and bfs, which `koda` runs when started under their names, as
# Claude Code's executable does.
koda-search = { workspace = true }
# Shared crates: the config file, and the log database.
koda-config = { workspace = true }
koda-state = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

serde_json = { workspace = true }
jsonschema = { workspace = true }

# Logging (subscriber for CLI configuration)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# Error handling
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The pty tests' terminal (libc) and the debug bundle they unpack (zip).
libc = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
koda-core = { workspace = true }
koda-test-utils = { path = "../koda-test-utils" }
serde_json = { workspace = true }
# tokio's `test-util` feature enables `#[tokio::test(start_paused = true)]` so
# frame_requester tests can manipulate the clock deterministically without
# relying on real wall-clock sleeps. Not in `full`, so we opt in here.
tokio = { workspace = true, features = ["full", "test-util"] }
# serial_test: forces tests that mutate global state (e.g. the panic hook in
# the regression test for #1124) to run sequentially. Cargo runs tests in
# parallel by default; without this, two tests calling `panic::set_hook`
# would race and produce flaky results.
serial_test = "4"
# Better assert_eq! diff output for ported codex tests (#1178). Used
# inside `composer/paste_burst.rs` test module; small focused dev-only
# crate. Worth keeping consistent with codex's testing style as we
# port more of their composer tests in PR 2 / PR 3.
pretty_assertions = "1"
# What a pty test's screen shows, parsed from the escape codes the TUI writes:
# ratatui redraws only changed cells, so the raw byte stream can't say what
# is on screen now.
vt100 = "0.18"

