[package]
name = "koda-test-utils"
version = "0.1.0"
edition = "2024"
description = "Test utilities for koda — mock providers, test sinks, and E2E harness"
license = "MIT"
publish = false

[lib]
name = "koda_test_utils"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
koda-core = { path = "../koda-core", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
insta = { version = "1", features = ["yaml", "redactions"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
anyhow = "1"
serde_json = "1"
