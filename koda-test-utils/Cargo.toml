[package]
name = "koda-test-utils"
version = "0.1.0"
edition = "2024"
description = "Test utilities for koda: the mock provider, a scripted stub server, the test sink and the E2E harness"
license = "MIT"
publish = false

[lib]
name = "koda_test_utils"
path = "src/lib.rs"

[features]
# Everything that builds on koda-core: the test environment, the golden
# and log helpers. Off, only the stub HTTP server (`network`) is left, for
# crates below koda-core such as koda-providers.
default = ["core"]
core = ["dep:koda-core", "dep:koda-state"]

[dependencies]
async-trait = { workspace = true }
koda-core = { workspace = true, optional = true }
# The mock provider is built on koda-providers' public API.
koda-providers = { workspace = true }
reqwest = { workspace = true }
koda-state = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
wiremock = "0.6"
