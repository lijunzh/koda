[workspace]
members = ["koda-core", "koda-cli", "koda-test-utils", "koda-sandbox"]
resolver = "3"
default-members = ["koda-cli"]

[workspace.package]
edition = "2024"
# Pinned to the actual minimum required by current code (uses
# `u64::is_multiple_of`, stable since 1.87). Surfacing this gives
# downstream consumers a clear MSRV signal instead of a late
# compile error from older toolchains. Bump in lockstep with any
# new stdlib feature usage; clippy's incompatible_msrv lint will
# catch the next drift.
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://github.com/lijunzh/koda"
authors = ["Lijun Zhu"]

# Shared dependency versions — single source of truth (DRY).
# Per-crate feature sets are layered via `features = [...]` at the
# consumer site. Add a dep here once it's used by 3+ crates; before
# that it's premature DRY (YAGNI).
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev-only deps shared across crates.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
