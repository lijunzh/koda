[workspace]
members = [
    "koda-core",
    "koda-cli",
    "koda-tui",
    "koda-oss",
    "koda-git",
    "koda-test-utils",
    "koda-sandbox",
    "koda-protocol",
    "koda-client",
    "koda-server",
    "koda-config",
    "koda-state",
    "koda-providers",
    "koda-skills",
    "koda-memory",
    "koda-command",
    "koda-mcp",
]
resolver = "3"
default-members = ["koda-cli"]

[workspace.package]
# The version of every published crate. A release bumps it here and in the
# exact pins of the Koda crates below, all in this file.
version = "0.7.5"
edition = "2024"
# The MSRV equals the pinned toolchain in rust-toolchain.toml and moves
# with it (DESIGN.md P1: latest dependencies, one environment). Koda
# supports one environment, its author's, so there is no separate,
# lower floor for other consumers. Bump this together with the pin.
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://lijunzh.github.io/koda"
authors = ["Lijun Zhu"]

# Shared dependency versions — single source of truth (DRY).
# Per-crate feature sets are layered via `features = [...]` at the
# consumer site. Add a dep here once it's used by 3+ crates; before
# that it's premature DRY (YAGNI).
[workspace.dependencies]
# Koda's own crates, pinned exactly, so every koda-cli builds against the
# crates it shipped with, whatever later 0.7.x versions exist.
koda-config = { path = "koda-config", version = "=0.7.5" }
koda-protocol = { path = "koda-protocol", version = "=0.7.5" }
koda-state = { path = "koda-state", version = "=0.7.5" }
koda-providers = { path = "koda-providers", version = "=0.7.5" }
koda-skills = { path = "koda-skills", version = "=0.7.5" }
koda-memory = { path = "koda-memory", version = "=0.7.5" }
koda-command = { path = "koda-command", version = "=0.7.5" }
koda-mcp = { path = "koda-mcp", version = "=0.7.5" }
koda-sandbox = { path = "koda-sandbox", version = "=0.7.5" }
koda-core = { path = "koda-core", version = "=0.7.5" }
koda-server = { path = "koda-server", version = "=0.7.5" }
koda-client = { path = "koda-client", version = "=0.7.5" }
koda-tui = { path = "koda-tui", version = "=0.7.5" }
koda-oss = { path = "koda-oss", version = "=0.7.5" }
koda-git = { path = "koda-git", version = "=0.7.5" }
base64 = "0.23"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared third-party deps used by 2+ crates. Hoisted here under #1265
# dep-hygiene so version bumps land in one place and `cargo tree -d`
# stays clean.
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
schemars = "1"
shlex = "2"
time = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4"] }

# Dev-only deps shared across crates.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
