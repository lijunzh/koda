[workspace]
members = ["koda-core", "koda-cli", "koda-test-utils", "koda-sandbox"]
resolver = "3"
default-members = ["koda-cli"]

[workspace.package]
edition = "2024"
# The MSRV equals the pinned toolchain in rust-toolchain.toml and moves
# with it (DESIGN.md P1: latest dependencies, one environment). Koda
# supports one environment, its author's, so there is no separate,
# lower floor for other consumers. Bump this together with the pin.
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://github.com/lijunzh/koda"
authors = ["Lijun Zhu"]

# Shared dependency versions — single source of truth (DRY).
# Per-crate feature sets are layered via `features = [...]` at the
# consumer site. Add a dep here once it's used by 3+ crates; before
# that it's premature DRY (YAGNI).
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared third-party deps used by 2+ crates. Hoisted here under #1265
# dep-hygiene so version bumps land in one place and `cargo tree -d`
# stays clean.
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"

# Dev-only deps shared across crates.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
