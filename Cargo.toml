[workspace]
members = ["koda-core", "koda-cli", "koda-test-utils", "koda-sandbox"]
resolver = "3"
default-members = ["koda-cli"]

[workspace.package]
edition = "2024"
# Pinned to the actual minimum required to pick up patched crate
# versions in the current dep graph. Notably, `time >= 0.3.47`
# (security fix RUSTSEC-2026-0009) requires Rust 1.88. Bumping
# from 1.87 → 1.88 is low-risk: 1.88 was released 2025-06-26
# (~10 months stable). Surfacing MSRV gives downstream consumers
# a clear signal instead of a late compile error from older
# toolchains. Bump in lockstep with any new stdlib feature usage
# or held-back security patch; clippy's incompatible_msrv lint
# catches the next drift.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://github.com/lijunzh/koda"
authors = ["Lijun Zhu"]

# Shared dependency versions — single source of truth (DRY).
# Per-crate feature sets are layered via `features = [...]` at the
# consumer site. Add a dep here once it's used by 3+ crates; before
# that it's premature DRY (YAGNI).
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared third-party deps used by 2+ crates. Hoisted here under #1265
# dep-hygiene so version bumps land in one place and `cargo tree -d`
# stays clean.
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"

# Dev-only deps shared across crates.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
