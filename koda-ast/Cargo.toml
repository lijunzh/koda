[package]
name = "koda-ast"
version = "0.2.15"
edition = "2024"
publish = false # workspace-only; not published to crates.io
description = "Tree-sitter AST analysis and syntax highlighting for the koda ecosystem"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://github.com/lijunzh/koda"
readme = "README.md"
keywords = ["ast", "tree-sitter", "highlight", "ai", "coding-agent"]
categories = ["development-tools"]
authors = ["Lijun Zhu"]

[lib]
name = "koda_ast"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
petgraph = "0.8"

# Tree-sitter runtime + grammars. Power both analysis and the
# (forthcoming) tree-sitter-highlight backend.
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"

# Syntect — fallback highlighter for languages without a tree-sitter
# grammar (toml/yaml/json/markdown/etc). Zero default features keeps
# the dep light; we only need parsing + bundled syntaxes/themes.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "parsing",
    "regex-fancy",
] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"
