[package]
name = "koda-ast"
version = "0.2.13"
edition = "2024"
publish = false # workspace-only; not published to crates.io
description = "MCP server for tree-sitter AST analysis — part of the koda ecosystem"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://github.com/lijunzh/koda"
readme = "README.md"
keywords = ["ast", "tree-sitter", "mcp", "ai", "coding-agent"]
categories = ["development-tools", "command-line-utilities"]
authors = ["Lijun Zhu"]

[[bin]]
name = "koda-ast"
path = "src/main.rs"

[lib]
name = "koda_ast"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1.4", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"
petgraph = "0.8"

[dev-dependencies]
tempfile = "3"
