# Pinned development + CI toolchain.
#
# Why pin: CI used to install floating `stable`, so a new Rust release
# could turn the `-D warnings` gates red with zero code change. rustc
# 1.99's clippy started flagging `double_must_use` inside
# `#[async_trait]` expansions, which broke every PR opened after the
# upgrade. With the pin, toolchain bumps are a deliberate one-line PR
# that fixes whatever new lints the bump surfaces.
#
# To bump: change `channel` here AND the `toolchain:` input on every
# `dtolnay/rust-toolchain` step in `.github/workflows/`. The
# "Check toolchain pin" step in ci.yml's Format job fails if they drift.
#
# This is NOT the MSRV. `rust-version` in the workspace Cargo.toml stays
# the minimum for crates.io consumers; clippy's `incompatible_msrv` lint
# keeps code honest against it.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
