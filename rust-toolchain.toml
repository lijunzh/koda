# Pinned development + CI toolchain.
#
# Why pin: CI used to install floating `stable`, so a new Rust release
# could turn the `-D warnings` gates red with zero code change. rustc
# 1.99's clippy started flagging `double_must_use` inside
# `#[async_trait]` expansions, which broke every PR opened after the
# upgrade. With the pin, toolchain bumps are a deliberate one-line PR
# that fixes whatever new lints the bump surfaces.
#
# To bump: change `channel` here, the `toolchain:` input on every
# `dtolnay/rust-toolchain` step in `.github/workflows/`, and
# `rust-version` in the workspace Cargo.toml. The "Check toolchain pin"
# step in ci.yml's Format job fails if the workflows drift.
#
# This is also the MSRV. `rust-version` in the workspace Cargo.toml
# equals this channel and moves with it: koda supports one environment,
# its author's, so there is no separate floor for other consumers
# (DESIGN.md P1).
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
