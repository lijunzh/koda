# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/

[advisories]
ignore = [
    # RUSTSEC-2025-0141 — bincode 1.x: unmaintained
    #
    # Pulled in transitively as:
    #   bincode 1.3.3  ←  syntect 5.3.0  ←  koda-cli (syntax highlighting)
    #
    # This is an "unmaintained" advisory, NOT a vulnerability — there is no
    # CVE attached. The crate works correctly; the maintainers just stopped
    # publishing 1.x updates after the bincode 2.x rewrite.
    #
    # Why we cannot trivially fix:
    # - syntect 5.3.0 (latest, released 2025-09-27) still depends on
    #   bincode 1.3 on master. There is no migration in flight: see
    #   trishume/syntect#623 and trishume/syntect#606 (both still open
    #   as of v0.2.15, no PRs).
    # - We use syntect via SyntaxSet::load_defaults_newlines and
    #   ThemeSet::load_defaults (koda-cli/src/highlight.rs), both of
    #   which deserialize bincode-encoded payloads compiled into the
    #   syntect binary at *its* build time. Disabling syntect's
    #   `default-syntaxes` / `default-themes` features would force us
    #   to ship and parse raw .sublime-syntax / .tmTheme files at
    #   startup — a meaningful regression in cold-start latency.
    #
    # Why we are not exposed:
    # - All bincode deserialization happens at koda-cli startup against
    #   syntect's static, build-time-embedded payloads. We never feed
    #   user-controlled bytes through bincode. The unmaintained-status
    #   advisory does not describe a known exploit, and even if one
    #   surfaced in the deserializer, it would require attacker control
    #   over the bytes being deserialized — which we do not provide.
    #
    # Track resolution: remove this ignore once syntect ships a release
    # with bincode 2.x or migrates off bincode entirely. Watch
    # trishume/syntect#623 for upstream movement.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2026-0097 — rand 0.8.x / 0.9.x: unsound with custom log handler
    #
    # Tracking issue: #1050
    #
    # The advisory is triggered by two transitive dependency chains we don't
    # directly control:
    #   rand 0.8.5  ← phf_generator 0.11 ← termwiz ← ratatui (TUI rendering)
    #   rand 0.9.2  ← tungstenite 0.29   ← tokio-tungstenite (WebSocket)
    #
    # rand 0.10.x (already in the lockfile via axum dev-dep) is NOT affected.
    # The unsoundness only manifests when an application installs a custom
    # global `log` handler *and* calls `rand::rng()` from inside that handler.
    # koda uses `tracing`, not a custom `log` handler, so we are not exposed.
    #
    # Suppression assumption: koda-cli must NOT use LogTracer or tracing_log
    # (which would bridge log → tracing and silently flip the exposure).
    # The release workflow verifies this with a grep check — see
    # .github/workflows/release.yml "Verify RUSTSEC-2026-0097 suppression".
    #
    # Track resolution: remove this ignore once tungstenite ≥ 0.30 and
    # phf_generator ≥ 0.12 ship with rand 0.10 bounds.
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0459 — libsqlite3-sys < 0.39: bundled SQLite < 3.54.0
    # (CVE-2026-119375) can return uninitialized page-cache memory when a
    # database is opened with a crafted sibling `-wal` file of another page size
    #
    # Pulled in as:
    #   libsqlite3-sys 0.30.1 (bundled)  ←  sqlx-sqlite 0.9.0  ←  sqlx 0.9.0  ←  koda-core
    #
    # Why we cannot trivially fix:
    # - sqlx 0.9.0 is the latest release, and sqlx-sqlite allows
    #   libsqlite3-sys only up to 0.37. The patched release is 0.39.
    #
    # Why we are not exposed:
    # - The attack needs the victim to open a database and `-wal` pair that a
    #   less trusted party wrote. Koda opens only its own databases, under its
    #   config directory (~/.config/koda/db). Anyone who can write files there
    #   already has the user's account.
    #
    # Track resolution: remove this ignore once a sqlx release allows
    # libsqlite3-sys >= 0.39, and update to it.
    "RUSTSEC-2026-0459",
]
