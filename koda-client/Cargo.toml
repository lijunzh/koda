[package]
name = "koda-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The client API of the Koda AI coding agent: start Koda, send requests, read its answers"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["ai", "coding-agent", "json-rpc", "client"]
categories = ["development-tools", "api-bindings"]

[dependencies]
koda-config = { workspace = true }
koda-core = { workspace = true }
koda-protocol = { workspace = true }
koda-server = { workspace = true }
koda-state = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util"] }

[dev-dependencies]
koda-sandbox = { workspace = true }
koda-test-utils = { path = "../koda-test-utils" }
tempfile = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
