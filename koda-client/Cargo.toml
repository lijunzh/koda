[package]
name = "koda-client"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
description = "The client API of the Koda AI coding agent: start Koda, send requests, read its answers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["ai", "coding-agent", "json-rpc", "client"]
categories = ["development-tools", "api-bindings"]

[dependencies]
koda-config = { path = "../koda-config", version = "=0.7.0" }
koda-state = { path = "../koda-state", version = "=0.7.0" }
koda-core = { path = "../koda-core", version = "=0.7.0" }
koda-protocol = { path = "../koda-protocol", version = "=0.7.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util"] }
tracing = { workspace = true }
uuid = { workspace = true }
# feedback/save: the ZIP, written through a temp file, as Codex writes its own.
tempfile = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
anyhow = { workspace = true }

[dev-dependencies]
koda-test-utils = { path = "../koda-test-utils" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
