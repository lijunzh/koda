[package]
name = "koda-client"
version = "0.6.4"
edition.workspace = true
rust-version.workspace = true
description = "The client API of the Koda AI coding agent: start Koda, send requests, read its answers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["ai", "coding-agent", "json-rpc", "client"]
categories = ["development-tools", "api-bindings"]
# Published once koda-cli depends on it; until then nothing outside the
# workspace uses it.
publish = false

[dependencies]
koda-core = { path = "../koda-core", version = "0.6.4" }
koda-protocol = { path = "../koda-protocol", version = "0.6.4" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
