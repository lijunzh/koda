name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Verify that the git tag matches the workspace version.
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require tag on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main (merge the PR first)"
            exit 1
          fi
      - name: Check tag matches workspace versions
        # The version and the exact pins of the Koda crates all live in the
        # root Cargo.toml; every published crate inherits the version.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}" python3 - <<'PY'
          import glob, os, sys, tomllib
          tag = os.environ["TAG"]
          root = tomllib.load(open("Cargo.toml", "rb"))
          errors = []
          if root["workspace"]["package"]["version"] != tag:
              errors.append(f"workspace version {root['workspace']['package']['version']}")
          for name, dep in root["workspace"]["dependencies"].items():
              if name.startswith("koda-") and dep.get("version") != f"={tag}":
                  errors.append(f"{name} pin {dep.get('version')}")
          for path in glob.glob("koda-*/Cargo.toml"):
              package = tomllib.load(open(path, "rb"))["package"]
              if package.get("publish", True) is False:
                  continue
              if package.get("version") != {"workspace": True}:
                  errors.append(f"{path} sets its own version")
          for error in errors:
              print(f"::error::Tag v{tag} does not match: {error}")
          sys.exit(1 if errors else 0)
          PY
          echo "✅ Tag v$TAG matches the workspace version and every Koda pin"


  # Security audit — run after version is verified but before burning
  # cross-platform build/test time on a release that might be flagged.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      # A prebuilt cargo-audit; it reads Cargo.lock and builds nothing.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny unsound --deny yanked
      - name: Verify RUSTSEC-2026-0097 suppression
        # The RUSTSEC-2026-0097 suppression in .cargo/audit.toml is valid only
        # as long as koda-cli and koda-tui do not use LogTracer or tracing_log (which would
        # bridge the log crate into tracing and flip our exposure). Fail the
        # release if that assumption is ever violated. See #1050.
        run: |
          if grep -rn 'LogTracer\|tracing_log' koda-cli/src/ koda-tui/src/ koda-oss/src/ koda-core/src/ koda-state/src/ koda-sandbox/src/; then
            echo "::error::RUSTSEC-2026-0097 suppression invalid: LogTracer/tracing_log found in workspace src. Remove the usage or drop the suppression in .cargo/audit.toml."
            exit 1
          fi
          echo "✅ RUSTSEC-2026-0097 suppression valid: no LogTracer/tracing_log in workspace src"

  # Tests before shipping binaries, on Linux. macOS tests ran on the release
  # PR, and the Mac binary is still built (`build`): GitHub's macOS arm64
  # runners are short of capacity, and a Mac test here once waited 10 minutes
  # for a runner while GitHub cancelled the Mac build (0.7.2, 2026-11-16).
  # Depends on verify-version + audit: no point burning test time when the
  # tag is wrong or has known vulnerabilities.
  test:
    name: Test (${{ matrix.os }})
    needs: [verify-version, audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
      - name: Set up Linux sandbox (bubblewrap) and poppler (Read's PDF tests)
        if: runner.os == 'Linux'
        run: |
          # See ci.yml for the rationale on the retry loop — same Azure
          # mirror flake protection.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y bubblewrap poppler-utils; then
              echo "bubblewrap and poppler-utils installed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::apt-get install bubblewrap failed after 5 attempts (Azure mirror unreachable?)"
              exit 1
            fi
            delay=$((15 * attempt))
            echo "::warning::apt-get install attempt $attempt/5 failed; retrying in ${delay}s"
            sleep $delay
          done
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      # As CI tests: nextest runs tests from all binaries at once, where
      # cargo test runs the binaries one after another; it skips doc tests.
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc

  build:
    name: Build ${{ matrix.target }}
    # Builds run alongside the tests; nothing ships until both pass, since
    # github-release (and Homebrew and crates.io after it) needs both.
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p koda-cli

      - name: Package
        run: |
          mkdir koda-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/koda target/${{ matrix.target }}/release/koda-logs koda-${{ matrix.target }}/
          cp README.md LICENSE koda-${{ matrix.target }}/
          tar czf koda-${{ matrix.target }}.tar.gz koda-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koda-${{ matrix.target }}
          path: koda-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    # No continue-on-error: a crate that fails to publish fails the release,
    # so a missing koda-cli on crates.io can't pass unnoticed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      # Every publishable crate not yet on crates.io, in dependency order,
      # trying again while the index lags; see the script. If this job
      # still fails, run the "Publish crates" workflow for the tag.
      - name: Publish to crates.io
        run: scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [build, test]  # fans out to update-homebrew and publish in parallel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Get content between this version's header and the next ## header (or EOF)
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release_body.md
          # If extraction failed, use a fallback
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
            echo "" >> release_body.md
            echo "See [CHANGELOG.md](https://github.com/lijunzh/koda/blob/main/CHANGELOG.md) for details." >> release_body.md
          fi
          echo "--- Extracted release notes ---"
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release_body.md
          files: artifacts/*.tar.gz

  update-homebrew:
    name: Update Homebrew Tap
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "aarch64_mac=$(sha256sum artifacts/koda-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "aarch64_linux=$(sha256sum artifacts/koda-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_linux=$(sha256sum artifacts/koda-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update formula
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lijunzh/homebrew-koda
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-koda

      - name: Write updated formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > homebrew-koda/Formula/koda.rb << 'FORMULA'
          class Koda < Formula
            desc "High-performance AI coding agent built in Rust"
            homepage "https://github.com/lijunzh/koda"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            # Apple Silicon only since 0.7.1: on an Intel Mac, Homebrew says
            # the formula needs ARM64; `cargo install koda-cli --locked` works.
            on_macos do
              depends_on arch: :arm64
              url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-aarch64-apple-darwin.tar.gz"
              sha256 "SHA_AARCH64_MAC"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_AARCH64_LINUX"
              else
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_X86_64_LINUX"
              end
            end

            def install
              bin.install "koda", "koda-logs"
            end

            test do
              assert_match "koda", shell_output("#{bin}/koda --version")
            end
          end
          FORMULA
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_AARCH64_MAC/${{ steps.sha.outputs.aarch64_mac }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_AARCH64_LINUX/${{ steps.sha.outputs.aarch64_linux }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_X86_64_LINUX/${{ steps.sha.outputs.x86_64_linux }}/g" homebrew-koda/Formula/koda.rb
          # Fix indentation (heredoc adds leading spaces)
          sed -i 's/^          //' homebrew-koda/Formula/koda.rb

      - name: Push formula update
        run: |
          cd homebrew-koda
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/koda.rb
          git commit -m "Update koda to ${GITHUB_REF#refs/tags/}"
          git push
