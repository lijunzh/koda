name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Verify that the git tag matches the workspace version.
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tag on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main (merge the PR first)"
            exit 1
          fi
      - name: Check tag matches workspace versions
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CORE_VER=$(grep '^version' koda-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CLI_VER=$(grep '^version' koda-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$CORE_VER" ]; then
            echo "::error::Tag v$TAG does not match koda-core version $CORE_VER"
            exit 1
          fi
          if [ "$TAG" != "$CLI_VER" ]; then
            echo "::error::Tag v$TAG does not match koda-cli version $CLI_VER"
            exit 1
          fi
          echo "✅ Tag v$TAG matches koda-core ($CORE_VER) and koda-cli ($CLI_VER)"

      - name: Check intra-workspace dependency versions are consistent
        # Catches stale version pins like `koda-email = { path = "...", version = "0.2.0" }`
        # when the actual crate is already at 0.2.3 — which causes crates.io publish failures
        # because the path dep is stripped on publish and the stale constraint is shipped instead.
        run: |
          CORE_VER=$(grep '^version' koda-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CLI_VER=$(grep  '^version' koda-cli/Cargo.toml  | head -1 | sed 's/.*"\(.*\)"/\1/')
          FAILED=0

          # koda-cli → koda-core
          CLI_DEP_CORE=$(grep 'koda-core\s*=' koda-cli/Cargo.toml | head -1 | sed 's/.*version\s*=\s*"\([^"]*\)".*/\1/')
          if [ "$CLI_DEP_CORE" != "$CORE_VER" ]; then
            echo "::error::koda-cli pins koda-core at $CLI_DEP_CORE but koda-core is $CORE_VER"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo "Fix the stale version pins above before tagging a release."
            exit 1
          fi
          echo "✅ All intra-workspace dependency version pins are consistent."

  # Cross-platform tests before shipping binaries.
  # Depends on verify-version: no point burning 30+ min of cross-platform
  # tests when the tag is wrong and the release is dead anyway.
  test:
    name: Test (${{ matrix.os }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features koda-core/test-support

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p koda-cli

      - name: Package
        run: |
          mkdir koda-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/koda koda-${{ matrix.target }}/
          cp README.md LICENSE koda-${{ matrix.target }}/
          tar czf koda-${{ matrix.target }}.tar.gz koda-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: koda-${{ matrix.target }}
          path: koda-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    environment: crates-io
    # crates.io versions are immutable. If this job fails, do NOT paper over
    # it — bump to the next patch version instead and cut a fresh release.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Publish order follows dependency graph:
      # koda-core → koda-cli
      # koda-ast, koda-email are publish=false (workspace-only, not on crates.io)
      - name: Publish koda-core
        run: cargo publish -p koda-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io index
        run: sleep 120
      - name: Publish koda-cli
        run: cargo publish -p koda-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    needs: build  # fans out to update-homebrew and publish in parallel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Get content between this version's header and the next ## header (or EOF)
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release_body.md
          # If extraction failed, use a fallback
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
            echo "" >> release_body.md
            echo "See [CHANGELOG.md](https://github.com/lijunzh/koda/blob/main/CHANGELOG.md) for details." >> release_body.md
          fi
          echo "--- Extracted release notes ---"
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          body_path: release_body.md
          files: artifacts/*.tar.gz

  update-homebrew:
    name: Update Homebrew Tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "aarch64_mac=$(sha256sum artifacts/koda-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_mac=$(sha256sum artifacts/koda-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "aarch64_linux=$(sha256sum artifacts/koda-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_linux=$(sha256sum artifacts/koda-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update formula
        uses: actions/checkout@v6
        with:
          repository: lijunzh/homebrew-koda
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-koda

      - name: Write updated formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > homebrew-koda/Formula/koda.rb << 'FORMULA'
          class Koda < Formula
            desc "High-performance AI coding agent built in Rust"
            homepage "https://github.com/lijunzh/koda"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_AARCH64_MAC"
              else
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-x86_64-apple-darwin.tar.gz"
                sha256 "SHA_X86_64_MAC"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_AARCH64_LINUX"
              else
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_X86_64_LINUX"
              end
            end

            def install
              bin.install "koda"
            end

            test do
              assert_match "koda", shell_output("#{bin}/koda --version")
            end
          end
          FORMULA
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_AARCH64_MAC/${{ steps.sha.outputs.aarch64_mac }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_X86_64_MAC/${{ steps.sha.outputs.x86_64_mac }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_AARCH64_LINUX/${{ steps.sha.outputs.aarch64_linux }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_X86_64_LINUX/${{ steps.sha.outputs.x86_64_linux }}/g" homebrew-koda/Formula/koda.rb
          # Fix indentation (heredoc adds leading spaces)
          sed -i 's/^          //' homebrew-koda/Formula/koda.rb

      - name: Push formula update
        run: |
          cd homebrew-koda
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/koda.rb
          git commit -m "Update koda to ${GITHUB_REF#refs/tags/}"
          git push
