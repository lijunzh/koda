name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Verify that the git tag matches the workspace version.
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tag on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main (merge the PR first)"
            exit 1
          fi
      - name: Check tag matches workspace versions
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          SANDBOX_VER=$(grep '^version' koda-sandbox/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CORE_VER=$(grep '^version' koda-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CLI_VER=$(grep '^version' koda-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$SANDBOX_VER" ]; then
            echo "::error::Tag v$TAG does not match koda-sandbox version $SANDBOX_VER"
            exit 1
          fi
          if [ "$TAG" != "$CORE_VER" ]; then
            echo "::error::Tag v$TAG does not match koda-core version $CORE_VER"
            exit 1
          fi
          if [ "$TAG" != "$CLI_VER" ]; then
            echo "::error::Tag v$TAG does not match koda-cli version $CLI_VER"
            exit 1
          fi
          echo "✅ Tag v$TAG matches koda-sandbox ($SANDBOX_VER), koda-core ($CORE_VER), koda-cli ($CLI_VER)"


  # Security audit — run after version is verified but before burning
  # cross-platform build/test time on a release that might be flagged.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit --deny unsound --deny yanked
      - name: Verify RUSTSEC-2026-0097 suppression
        # The RUSTSEC-2026-0097 suppression in .cargo/audit.toml is valid only
        # as long as koda-cli does not use LogTracer or tracing_log (which would
        # bridge the log crate into tracing and flip our exposure). Fail the
        # release if that assumption is ever violated. See #1050.
        run: |
          if grep -rn 'LogTracer\|tracing_log' koda-cli/src/ koda-core/src/ koda-sandbox/src/; then
            echo "::error::RUSTSEC-2026-0097 suppression invalid: LogTracer/tracing_log found in workspace src. Remove the usage or drop the suppression in .cargo/audit.toml."
            exit 1
          fi
          echo "✅ RUSTSEC-2026-0097 suppression valid: no LogTracer/tracing_log in workspace src"

  # Cross-platform tests before shipping binaries.
  # Depends on verify-version + audit: no point burning 30+ min of cross-platform
  # tests when the tag is wrong or has known vulnerabilities.
  test:
    name: Test (${{ matrix.os }})
    needs: [verify-version, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
      - name: Set up Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo test --workspace --features koda-core/test-support

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p koda-cli

      - name: Package
        run: |
          mkdir koda-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/koda koda-${{ matrix.target }}/
          cp README.md LICENSE koda-${{ matrix.target }}/
          tar czf koda-${{ matrix.target }}.tar.gz koda-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: koda-${{ matrix.target }}
          path: koda-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    environment: crates-io
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Publish order follows dependency graph: koda-sandbox → koda-core → koda-cli.
      # Each crate waits for its dep to appear in the sparse index before publishing,
      # otherwise cargo resolve will fail with "no matching version".
      - name: Publish koda-sandbox
        run: cargo publish -p koda-sandbox
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for koda-sandbox in sparse index
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          URL="https://index.crates.io/ko/da/koda-sandbox"
          echo "Polling $URL for koda-sandbox $VERSION ..."
          for i in $(seq 1 20); do
            if curl -sf "$URL" | grep -q "\"vers\":\"${VERSION}\""; then
              echo "✅ koda-sandbox $VERSION is in the index (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/20 — not yet, sleeping 15s"
            sleep 15
          done
          echo "⚠️ timed out after 300s — koda-sandbox $VERSION may still propagate"
      - name: Publish koda-core
        run: cargo publish -p koda-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for koda-core in sparse index
        # cargo publish waits up to ~60s for the index; we poll on top of that.
        # The sparse index URL is the canonical source of truth — same thing
        # cargo-workspaces and cargo-release query internally.
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          URL="https://index.crates.io/ko/da/koda-core"
          echo "Polling $URL for koda-core $VERSION ..."
          for i in $(seq 1 20); do
            if curl -sf "$URL" | grep -q "\"vers\":\"${VERSION}\""; then
              echo "✅ koda-core $VERSION is in the index (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/20 — not yet, sleeping 15s"
            sleep 15
          done
          echo "⚠️ timed out after 300s — koda-core $VERSION may still propagate"
      - name: Publish koda-cli
        run: cargo publish -p koda-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    needs: build  # fans out to update-homebrew and publish in parallel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Get content between this version's header and the next ## header (or EOF)
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release_body.md
          # If extraction failed, use a fallback
          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
            echo "" >> release_body.md
            echo "See [CHANGELOG.md](https://github.com/lijunzh/koda/blob/main/CHANGELOG.md) for details." >> release_body.md
          fi
          echo "--- Extracted release notes ---"
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release_body.md
          files: artifacts/*.tar.gz

  update-homebrew:
    name: Update Homebrew Tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "aarch64_mac=$(sha256sum artifacts/koda-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_mac=$(sha256sum artifacts/koda-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "aarch64_linux=$(sha256sum artifacts/koda-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x86_64_linux=$(sha256sum artifacts/koda-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update formula
        uses: actions/checkout@v6
        with:
          repository: lijunzh/homebrew-koda
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-koda

      - name: Write updated formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > homebrew-koda/Formula/koda.rb << 'FORMULA'
          class Koda < Formula
            desc "High-performance AI coding agent built in Rust"
            homepage "https://github.com/lijunzh/koda"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_AARCH64_MAC"
              else
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-x86_64-apple-darwin.tar.gz"
                sha256 "SHA_X86_64_MAC"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_AARCH64_LINUX"
              else
                url "https://github.com/lijunzh/koda/releases/download/vVERSION_PLACEHOLDER/koda-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_X86_64_LINUX"
              end
            end

            def install
              bin.install "koda"
            end

            test do
              assert_match "koda", shell_output("#{bin}/koda --version")
            end
          end
          FORMULA
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_AARCH64_MAC/${{ steps.sha.outputs.aarch64_mac }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_X86_64_MAC/${{ steps.sha.outputs.x86_64_mac }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_AARCH64_LINUX/${{ steps.sha.outputs.aarch64_linux }}/g" homebrew-koda/Formula/koda.rb
          sed -i "s/SHA_X86_64_LINUX/${{ steps.sha.outputs.x86_64_linux }}/g" homebrew-koda/Formula/koda.rb
          # Fix indentation (heredoc adds leading spaces)
          sed -i 's/^          //' homebrew-koda/Formula/koda.rb

      - name: Push formula update
        run: |
          cd homebrew-koda
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/koda.rb
          git commit -m "Update koda to ${GITHUB_REF#refs/tags/}"
          git push
