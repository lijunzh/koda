name: Coverage

on:
  push:
    branches: [main]   # Post-merge: opens/closes regression issues, badge source.
  # Pull-request gate (#1265 item 8c, PR-2): block merging when a
  # security-boundary file regresses below its per-file threshold.
  # Path filter limits CI cost — PRs that don't touch the gated
  # crates can't possibly regress their coverage. Workflow + script
  # changes ARE included so threshold edits get re-validated.
  pull_request:
    paths:
      - 'koda-core/**'
      - 'koda-sandbox/**'
      - '.github/workflows/coverage.yml'
      - 'scripts/check_per_file_coverage.py'

permissions:
  contents: read
  issues:   write      # Needed to open / comment on regression issues (push-to-main only)

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  coverage:
    name: Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: coverage-${{ runner.os }}
      - uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2
        id: install
        # The action's CDN download already retries 11 times. We tolerate the
        # remaining 0.x% of cases (GitHub releases CDN returning sustained
        # 504s for >1 min) by surviving the failure and converting it into
        # a clearly-labelled "infra flake" downstream so we don't open a
        # bogus coverage-regression issue against a clean main. See #930.
        continue-on-error: true
        with:
          tool: cargo-llvm-cov
      - name: Set up Linux sandbox (bubblewrap)
        if: runner.os == 'Linux' && steps.install.outcome == 'success'
        run: |
          # See ci.yml for the rationale on the retry loop — same Azure
          # mirror flake protection.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y bubblewrap; then
              echo "bubblewrap installed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::apt-get install bubblewrap failed after 5 attempts (Azure mirror unreachable?)"
              exit 1
            fi
            delay=$((15 * attempt))
            echo "::warning::apt-get install attempt $attempt/5 failed; retrying in ${delay}s"
            sleep $delay
          done
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: koda-core coverage (≥ 80% lines)
        id: core
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          # --test-threads=1: compact::test_circuit_breaker mutates global
          # atomic state; concurrent sibling tests can re-trip the circuit
          # between reset_compact_failures() and the assertion.
          cargo llvm-cov \
            --lib -p koda-core \
            --features koda-core/test-support \
            --fail-under-lines 80 \
            --lcov --output-path lcov-core.info \
            -- --test-threads=1

      # JSON export from the same profraw as the lcov run above. Used by
      # the per-file threshold check (#1265 item 8c) further down. Must
      # run BEFORE the koda-sandbox coverage step — that step's test run
      # overwrites the workspace profraw.
      - name: koda-core JSON coverage report
        id: core_json
        if: steps.core.outcome == 'success'
        continue-on-error: true
        run: |
          cargo llvm-cov report --json --output-path cov-core.json

      - name: koda-sandbox coverage (≥ 80% lines)
        id: sandbox
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          # koda-sandbox is the security boundary. Gate: 80% lines,
          # same as koda-core. Measured baseline (2026-04-26): ~87.5%.
          #
          # --skip pool::tests: pool tests spawn a koda-fs-worker subprocess;
          # under llvm-cov the instrumented binary path differs from the one
          # cargo placed in PATH, so the worker is never found and all 12
          # pool tests fail with "worker not found". They pass cleanly under
          # `cargo test` — this is a tooling artifact, not a real failure.
          # Normal CI already covers pool code at full fidelity.
          cargo llvm-cov \
            --lib -p koda-sandbox \
            --fail-under-lines 80 \
            --lcov --output-path lcov-sandbox.info \
            -- --skip pool::tests

      # Symmetric to core_json above.
      - name: koda-sandbox JSON coverage report
        id: sandbox_json
        if: steps.sandbox.outcome == 'success'
        continue-on-error: true
        run: |
          cargo llvm-cov report --json --output-path cov-sandbox.json

      # #1265 item 8c: per-file thresholds for security-boundary modules.
      # The crate-level 80% gate above is a coarse safety net — a single
      # security-critical file can regress while the crate average stays
      # above the bar (hundreds of low-risk files dilute the signal).
      # This step gates each file enumerated in
      # scripts/check_per_file_coverage.py at its measured baseline
      # minus a small buffer. Files that don't compile on this platform
      # (bwrap.rs on macOS, seatbelt.rs on Linux) are skipped — the
      # other platform's run gates them.
      - name: Per-file security-boundary coverage thresholds (#1265 item 8c)
        id: per_file
        if: steps.core_json.outcome == 'success' && steps.sandbox_json.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/check_per_file_coverage.py cov-core.json cov-sandbox.json

      # Drop a marker so the report job can distinguish "tooling broken,
      # never measured coverage" from "actually measured, dropped below
      # threshold". Without this, a CDN flake on either platform would
      # auto-open / auto-close coverage-regression issues falsely.
      #
      # `always() &&` is load-bearing: GitHub Actions implicitly gates every
      # step on `success()` of all prior steps, so without it this step
      # would be SKIPPED when an upstream step (e.g. actions/checkout, the
      # toolchain install, or rust-cache) fails — exactly the case where
      # we most need the marker. See #1131 for the false-positive that
      # motivated this guard: a transient DNS failure on macOS killed
      # actions/checkout, no marker was uploaded, and the report job
      # filed a bogus coverage-regression issue against a clean main.
      #
      # Filename is sanitized to alphanumerics+`_-` so a future runner OS
      # name with whitespace or punctuation (e.g. "Windows Server 2022")
      # cannot mangle the report job's `basename {} .flake` filter. See #937.
      - name: Mark infra flake (if install or any earlier step failed)
        if: always() && steps.install.outcome != 'success'
        run: |
          set -euo pipefail
          safe_os=$(printf '%s' "${{ runner.os }}" | tr -cd '[:alnum:]_-')
          mkdir -p flake-markers
          # Distinguish the two scenarios in the marker body so a human
          # reading the artifact later can tell what actually broke.
          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            reason="taiki-e/install-action failed on ${{ runner.os }} — likely GitHub releases CDN flake."
          else
            reason="An upstream step (checkout / toolchain / cache) failed on ${{ runner.os }} before cargo-llvm-cov could be installed."
          fi
          echo "$reason See run logs." > "flake-markers/${safe_os}.flake"

      - name: Upload infra-flake marker
        if: always() && steps.install.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: infra-flake-${{ runner.os }}
          path: flake-markers/
          retention-days: 7

      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        if: steps.install.outcome == 'success'
        with:
          name: lcov-reports-${{ runner.os }}
          path: |
            lcov-*.info
            cov-*.json
          retention-days: 7

      # Final guard: fail this matrix leg only on REAL coverage regressions.
      # Infra flakes (install failed) emit a warning and exit 0 so they
      # don't poison the regression-reporting job.
      - name: Verify coverage outcomes
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            echo "::warning::Skipping coverage verification on ${{ runner.os }}: " \
                 "cargo-llvm-cov install failed (likely transient CDN issue). " \
                 "Will retry on next push to main."
            exit 0
          fi
          fail=0
          for crate_outcome in \
              "crate koda-core=${{ steps.core.outcome }}" \
              "crate koda-sandbox=${{ steps.sandbox.outcome }}" \
              "per-file thresholds (#1265 8c)=${{ steps.per_file.outcome }}"; do
            name="${crate_outcome%%=*}"
            outcome="${crate_outcome#*=}"
            if [ "$outcome" != "success" ]; then
              echo "::error::Coverage check '$name' did not succeed: $outcome"
              fail=1
            fi
          done
          exit $fail

  # ── Merge lcov reports across platforms ────────────────────────────────
  merge:
    name: Merge Coverage Reports
    needs: coverage
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Install lcov
        run: sudo apt-get install -y lcov

      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-reports-*
          merge-multiple: true
          path: reports

      - name: Merge per-crate reports
        run: |
          cd reports
          # Merge each crate's reports across platforms.
          for crate in core sandbox; do
            files=$(ls lcov-${crate}.info 2>/dev/null || true)
            if [ -n "$files" ]; then
              # If multiple files exist (from matrix), merge them.
              # With merge-multiple they land in the same dir, but
              # artifact names differ per-OS so we just concat all
              # matching files.
              lcov_args=""
              for f in lcov-${crate}.info; do
                lcov_args="$lcov_args --add-tracefile $f"
              done
              lcov $lcov_args --ignore-errors mismatch,corrupt,unused,empty \
                --output-file merged-${crate}.info 2>/dev/null || \
                cp lcov-${crate}.info merged-${crate}.info
            fi
          done

          # Final unified report across all crates + platforms.
          # `--ignore-errors mismatch,corrupt,unused,empty` is required because
          # Ubuntu 22.04 ships lcov 1.15 which doesn't understand Rust's v0
          # symbol mangling (e.g. closures inside generic functions). See #913
          # for the full root-cause analysis. Per-line coverage totals are
          # unaffected; only function-name parsing is bypassed.
          merge_args=""
          for f in merged-*.info; do
            [ -f "$f" ] && merge_args="$merge_args --add-tracefile $f"
          done
          if [ -n "$merge_args" ]; then
            lcov $merge_args --ignore-errors mismatch,corrupt,unused,empty \
              --output-file merged-all.info
          fi

      - name: Upload merged reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-merged
          path: reports/merged-*.info
          retention-days: 7

  # ── Report regressions ──────────────────────────────────────────
  report:
    name: Report
    needs: coverage
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6

      # Pull infra-flake markers (one per platform that failed to install
      # cargo-llvm-cov). Their presence means coverage was never measured
      # there — not a real regression. See #930 for the original false
      # positive that motivated this guard.
      #
      # We CANNOT use `continue-on-error: true` on the download itself:
      # that would swallow genuine artifact-service outages and let us
      # auto-close real regression issues during a GitHub incident
      # (false negative, the dangerous direction). Instead we probe the
      # API first — a 200 with zero matching artifacts is the legitimate
      # "healthy run, no flake" case; any other API result fails loudly.
      # See #938.
      - name: Probe for infra-flake markers
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("infra-flake-"))] | length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} infra-flake marker artifact(s) on this run."

      - name: Download infra-flake markers
        if: steps.probe.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: infra-flake-*
          merge-multiple: true
          path: flake-markers

      - name: Detect infra flake
        id: flake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if compgen -G "flake-markers/*.flake" > /dev/null; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            # Marker filenames are sanitized to alphanumerics+`_-` (see
            # the upload step in the coverage job), so basename is safe
            # against weird OS names if a third platform ever joins.
            platforms=$(find flake-markers -maxdepth 1 -name '*.flake' \
                          -exec basename {} .flake \; | tr '\n' ' ')
            echo "::warning::Coverage matrix contained an infra flake " \
                 "(cargo-llvm-cov install failed on ${platforms}). " \
                 "Skipping regression-issue bookkeeping; will retry on next push."
            cat flake-markers/*.flake
          else
            # Belt-and-suspenders: if the matrix job failed but NO platform
            # uploaded lcov reports, the marker step itself never had a
            # chance to run (runner image broken, mass GitHub Actions
            # outage, etc). A real coverage regression would always have
            # produced lcov files — if there are zero, this is infra. See
            # the second-order failure mode discussed in #1131. Without
            # this, a fully-broken runner would still file a bogus
            # regression issue against a clean main.
            if [ "${{ needs.coverage.result }}" = "failure" ]; then
              lcov_count=$(gh api \
                "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '[.artifacts[] | select(.name | startswith("lcov-reports-"))] | length')
              if [ "$lcov_count" = "0" ]; then
                echo "detected=true" >> "$GITHUB_OUTPUT"
                echo "::warning::Coverage matrix failed but no platform " \
                     "uploaded lcov reports — treating as infra flake " \
                     "(runner image / Actions service issue). See #1131."
                exit 0
              fi
            fi
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      # Check if ANY platform reported a failure for any crate.
      # The matrix outputs aren't directly accessible, so we check
      # the overall job result — if any matrix leg failed, the job
      # result is 'failure'. Suppress when an infra flake was detected:
      # we can't trust 'failure' to mean "real regression" in that case.
      - name: Report regression
        # Push-only: PR failures should NOT open "Coverage regression
        # on main" issues — the PR's own failed check is the signal.
        # The PR-time gate is enforced by the final `Fail if any crate
        # below threshold` step, which still runs on PRs.
        if: github.event_name == 'push' && needs.coverage.result == 'failure' && steps.flake.outputs.detected != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="$(printf "## Coverage regression on \`main\`\n\nCommit: [\`%s\`](%s/commit/%s)\nRun: %s\n\nOne or more crates dropped below their coverage threshold on at least one platform (Linux / macOS).\n\n### Next steps\n1. Check the lcov reports attached to the [failed run](%s).\n2. Add tests to bring the affected crate(s) back above threshold.\n3. The issue will be closed automatically once coverage passes on \`main\` again." \
            "$SHORT" "${{ github.server_url }}/${{ github.repository }}" "$COMMIT" \
            "$RUN_URL" "$RUN_URL")"

          # Ensure the label exists (idempotent).
          gh label create "coverage-regression" \
            --description "Coverage dropped below threshold on main" \
            --color "e11d48" 2>/dev/null || true

          # Dedup: comment on existing open issue, or open a fresh one.
          EXISTING=$(gh issue list \
            --label "coverage-regression" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "Coverage regression issue #$EXISTING already open — adding comment."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Coverage regression on main ($SHORT)" \
              --label "coverage-regression" \
              --body "$BODY"
          fi

      # Auto-close the regression issue when coverage is green again.
      # Only act on REAL green runs — if this run flaked at the install
      # step we never measured coverage, so we mustn't close a legitimate
      # open regression issue.
      - name: Close regression issue if green
        # Push-only: PRs don't manage main's open-issue state. A PR
        # passing while a main regression issue is open just means the
        # PR didn't reproduce the regression — not that main is fixed.
        if: github.event_name == 'push' && needs.coverage.result == 'success' && steps.flake.outputs.detected != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list \
            --label "coverage-regression" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:7}"
            gh issue close "$EXISTING" \
              --comment "Coverage is back above threshold on \`main\` at commit \`$SHORT\`. 🎉"
          fi

      # Fail the workflow run so the badge goes red and GitHub notifies you.
      # Suppressed on infra flakes: those should show as a yellow warning,
      # not a red badge, since coverage was never actually measured.
      - name: Fail if any crate below threshold
        if: needs.coverage.result == 'failure' && steps.flake.outputs.detected != 'true'
        run: exit 1
