name: CI

on:
  push:
    branches: [main]    # Catch post-merge config drift on protected branch
  pull_request:
    branches: [main]
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# ── Job topology ─────────────────────────────────────────────────────────────
#
# Each job has ONE responsibility (Zen of Python: "There should be one — and
# preferably only one — obvious way to do it.") so PR check labels surface
# exactly what broke without grepping the log:
#
#   fmt     → formatting
#   clippy  → lints + compile WITH test-support features (full lint surface)
#   check   → compile sanity WITHOUT features (what crates.io users see)
#   test    → behaviour, matrix on (ubuntu, macos)
#   doc     → doc compile + intra-doc links + -Dwarnings
#   audit   → dependency vulnerabilities
#
# All jobs run in parallel; wall-clock is gated by the slowest (test ≈ 3min).
#
# Why both `clippy` and `check`? They run with different feature sets:
#   - clippy enables `koda-core/test-support` (covers the full code surface)
#   - check uses no features (validates the crates.io shape)
# This works only because koda-core has zero `#[cfg(not(feature = "..."))]`
# code today. If that changes, clippy will stop covering the no-features
# path and you'll want a second clippy run with --no-default-features.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      # No rust-cache — fmt doesn't compile anything. Skipping cache saves
      # the ~10s setup overhead and keeps the job at ~30s end-to-end.
      - run: cargo fmt --all --check
      # #1109 F2 guard: every #[tokio::test] in modules that touch
      # tokio::spawn / BgAgentRegistry / sub-agent dispatch / watch /
      # broadcast must use flavor="multi_thread". Pure text scan, ~1s,
      # rides the fmt job because it's the cheapest place that already
      # has Python and a checkout.
      - name: Check tokio test flavor (#1109 F2)
        run: python3 scripts/check_tokio_test_flavor.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: clippy-Linux
      - run: cargo clippy --workspace --all-targets --features koda-core/test-support -- -D warnings

  check:
    name: Check (no features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: check-Linux
      # Catches cfg-gated items invisible behind feature flags. This is the
      # crates.io consumer build — koda-core ships without test-support.
      - run: cargo check --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: ci-${{ runner.os }}
      - name: Set up Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          # Enable unprivileged user namespaces so bwrap can sandbox.
          # GH Actions runners disable this by default.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # Ubuntu 24.04+ additionally gates userns behind AppArmor.
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        run: cargo test --workspace --features koda-core/test-support 2>&1 | tee test-output.log
        # `tee` keeps live streaming for the GH log AND captures output
        # for the assertion step below. We pipe stderr to stdout because
        # cargo test prints test names to stderr in some configurations.
      # #1104: regression guard — fail CI if the bwrap SEC-002 / TOCTOU
      # tests didn't actually run. Without this, a future cfg-gate or
      # test-binary split could silently exclude them and we'd only
      # find out by getting hacked. Linux-only: bwrap is gated to
      # `target_os = "linux"`.
      - name: Assert bwrap SEC-002 regression tests ran (#1104)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          required_tests=(
            git_config_deny_pre_creates_for_non_git_dir_to_close_toctou
            git_config_deny_adds_ro_bind_for_existing_git_dir
            git_config_deny_skips_worktree_gitdir_pointer
            git_config_deny_preserves_existing_config_mtime
          )
          missing=()
          for t in "${required_tests[@]}"; do
            if ! grep -qE "test bwrap::tests::${t} \.\.\. ok" test-output.log; then
              missing+=("$t")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required bwrap regression tests did not run:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ All ${#required_tests[@]} bwrap SEC-002/TOCTOU regression tests ran."

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: doc  # stable across branches & workflow edits
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit --deny unsound --deny yanked
