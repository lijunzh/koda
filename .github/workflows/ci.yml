name: CI

on:
  push:
    branches: [main]    # Catch post-merge config drift on protected branch
  pull_request:
    branches: [main]
  schedule:
    # Nightly on main, off-peak: the one main run with macOS (see `test`).
    - cron: '17 9 * * *'
  workflow_dispatch:
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# ── Job topology ─────────────────────────────────────────────────────────────
#
# Each job has ONE responsibility (Zen of Python: "There should be one — and
# preferably only one — obvious way to do it.") so PR check labels surface
# exactly what broke without grepping the log:
#
#   fmt     → formatting
#   clippy  → lints + compile, every target
#   check   → compile sanity, every target (what crates.io users see)
#   test    → behaviour, on ubuntu; also macos on PRs and nightly
#   doc     → doc compile + intra-doc links + -Dwarnings
#   audit   → dependency advisories (on PRs, only when deps change)
#   desktop → the desktop app: type check, unit tests, build, and a test
#             against koda serve
#
#   required → "CI required": succeeds only if every job above did
#
# All jobs run in parallel; wall-clock is gated by the slowest (test ≈ 4min).
# Each has a timeout well above its usual time: a hung job would otherwise
# hold a runner for GitHub's six-hour default.
#
# `clippy` and `check` once ran with different feature sets; since the
# `test-support` feature went (test code lives in koda-test-utils, as Codex
# removed codex-core's in #11405), both build the one shape crates.io users
# get. `check` stays as a fast compile gate and a required check name.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
          components: rustfmt
      # No rust-cache — fmt doesn't compile anything. Skipping cache saves
      # the ~10s setup overhead and keeps the job at ~30s end-to-end.
      - run: cargo fmt --all --check
      # #1109 F2 guard: every #[tokio::test] in modules that touch
      # tokio::spawn / BgAgentRegistry / sub-agent dispatch / watch /
      # broadcast must use flavor="multi_thread". Pure text scan, ~1s,
      # rides the fmt job because it's the cheapest place that already
      # has a checkout. Bash port (#1328 follow-up: kept the
      # everything-in-Rust workspace free of one-off Python scripts).
      - name: Check tokio test flavor (#1109 F2)
        run: scripts/check_tokio_test_flavor.sh
      # koda-cli and koda-tui reach core only through the client protocol, as
      # Codex's CI keeps codex-core out of its TUI: koda-core isn't one of
      # their dependencies, and no koda_core path is in their sources. Pure
      # text scan.
      - name: Check the TUI's core boundary
        run: scripts/check_tui_core_boundary.sh
      # crates.io rejects a bad keyword only at upload, after the crates
      # before it are published; this caught nothing in dry-run (0.7.1).
      # Pure text scan.
      - name: Check crate keywords
        run: scripts/check_crate_keywords.sh

      # Toolchain pin guard: every dtolnay/rust-toolchain step in every
      # workflow must install exactly the channel pinned in
      # rust-toolchain.toml. A step without a `toolchain:` input falls
      # back to floating `stable`, which is how rustc 1.99's new clippy
      # lints turned CI red with no code change. Pure text scan, ~50ms.
      - name: Check toolchain pin
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$pinned" ]; then
            echo "::error::rust-toolchain.toml has no channel line."
            exit 1
          fi
          drift=$(awk -v want="$pinned" '
            function report() {
              if (got != want) print loc " installs " (got == "" ? "floating stable (no toolchain input)" : got)
              open = 0
            }
            FNR == 1 && open { report() }
            /uses: dtolnay\/rust-toolchain@/ { if (open) report(); open = 1; got = ""; loc = FILENAME ":" FNR; next }
            open && /^ *- / { report() }
            open && /^ *toolchain:/ { got = $2; gsub(/"/, "", got) }
            END { if (open) report() }
          ' .github/workflows/*.yml)
          if [ -n "$drift" ]; then
            echo "::error::Workflow toolchain drifts from rust-toolchain.toml ($pinned):"
            echo "$drift"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
          components: clippy
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
        with:
          shared-key: clippy-Linux
          # PRs restore main's cache but don't save their own: a PR's cache
          # can only be read by that PR, and seven of them per PR pushed the
          # repo past GitHub's 10 GB limit, evicting main's (2026-11-15).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: Check (no features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
        with:
          shared-key: check-Linux
          # PRs restore main's cache but don't save their own: a PR's cache
          # can only be read by that PR, and seven of them per PR pushed the
          # repo past GitHub's 10 GB limit, evicting main's (2026-11-15).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The crates.io consumer build. There are no test features to leave
      # out any more; this is the plain workspace build.
      - run: cargo check --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
      # macOS runs on PRs and the nightly run, not after each merge: GitHub's
      # macOS arm64 runners are short of capacity, and a merge plus a tag
      # once queued four Mac jobs at once, two of which GitHub cancelled
      # unstarted after 15 minutes (0.7.2, 2026-11-16). The PR already tested
      # the merged code on macOS; the nightly run checks main there and
      # saves the macOS cache that PRs restore.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
        with:
          shared-key: ci-${{ runner.os }}
          # PRs restore main's cache but don't save their own: a PR's cache
          # can only be read by that PR, and seven of them per PR pushed the
          # repo past GitHub's 10 GB limit, evicting main's (2026-11-15).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up Linux sandbox (bubblewrap) and poppler (Read's PDF tests)
        if: runner.os == 'Linux'
        run: |
          # Hardened install: Azure Ubuntu mirrors (azure.archive.ubuntu.com)
          # periodically fail DNS resolution from GH Actions runners, blocking
          # CI on a transient infra issue unrelated to the change under test.
          # Retry with exponential backoff up to 5 times (max ~2.5 min) before
          # giving up. See https://github.com/lijunzh/koda/pull/1179 for the
          # failure mode that motivated this.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y bubblewrap poppler-utils; then
              echo "bubblewrap and poppler-utils installed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::apt-get install bubblewrap failed after 5 attempts (Azure mirror unreachable?)"
              exit 1
            fi
            delay=$((15 * attempt))
            echo "::warning::apt-get install attempt $attempt/5 failed; retrying in ${delay}s"
            sleep $delay
          done
          # Enable unprivileged user namespaces so bwrap can sandbox.
          # GH Actions runners disable this by default.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # Ubuntu 24.04+ additionally gates userns behind AppArmor.
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest
      - name: Give the sandbox tests the folders they check
        # The credential-path tests use the runner's own home: they check
        # the sandbox lets a command read ~/.ssh and ~/.aws but not write
        # them, and keeps it out of ~/.config/koda/db.
        run: mkdir -p ~/.ssh ~/.aws ~/.config/koda/db
      - name: Test
        # nextest runs every test in its own process and tests from all
        # binaries at once (.config/nextest.toml). The ci profile writes
        # target/nextest/ci/junit.xml, which the guards below read.
        run: cargo nextest run --workspace --profile ci
        env:
          # A sandbox test that can't run here fails instead of skipping
          # (`koda_sandbox::skip_test`): a skipped test passes and checks
          # nothing, which the guards below can't tell from a real pass.
          KODA_REQUIRE_SANDBOX: "1"
      - name: Doc tests
        # nextest doesn't run doc tests.
        run: cargo test --workspace --doc
      # #1104: regression guard — fail CI if the bwrap SEC-002 / TOCTOU
      # tests didn't actually run. Without this, a future cfg-gate or
      # test-binary split could silently exclude them and we'd only
      # find out by getting hacked. Linux-only: bwrap is gated to
      # `target_os = "linux"`.
      - name: Assert bwrap SEC-002 regression tests ran (#1104)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          required_tests=(
            git_config_deny_pre_creates_for_non_git_dir_to_close_toctou
            git_config_deny_adds_ro_bind_for_existing_git_dir
            git_config_deny_skips_worktree_gitdir_pointer
            git_config_deny_preserves_existing_config_mtime
          )
          missing=()
          for t in "${required_tests[@]}"; do
            # A test that passed is a self-closing <testcase .../> in the
            # JUnit report; a failed one has a child element.
            if ! grep -qE "<testcase name=\"bwrap::tests::${t}\" [^>]*/>" target/nextest/ci/junit.xml; then
              missing+=("$t")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required bwrap regression tests did not run:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ All ${#required_tests[@]} bwrap SEC-002/TOCTOU regression tests ran."

      # #1265 item 8b: fail-closed guard for security-boundary tests.
      # Same shape as the bwrap check above, broadened to every
      # security-critical test across web_fetch (SSRF + redirect),
      # file_tools (symlink/TOCTOU), MCP transport (SSRF), and
      # sandbox (path confinement). Without this guard, a future
      # `#[cfg(...)]`, `#[ignore]`, or test-binary split could
      # silently exclude any of these and we'd only learn from a CVE.
      #
      # Cross-platform: every test below runs on both ubuntu-latest
      # and macos-latest. Linux-only or macos-only tests stay out of
      # this list (the bwrap step above handles Linux-only).
      - name: Assert security-boundary tests ran (#1265 item 8b)
        run: |
          set -euo pipefail
          # Each entry is a test's full path within its binary, as nextest's
          # JUnit report names it. The full path
          # (not just the function name) is intentional: it pins the
          # test to its module, so renaming a fn that happens to
          # collide with a test name elsewhere can't accidentally
          # satisfy the check.
          required_tests=(
            # ── web_fetch SSRF + redirect (#1282) ────────────────────────
            "tools::web_fetch::tests::test_web_fetch_blocks_ssrf"
            "tools::web_fetch::tests::test_redirect_to_loopback_is_blocked_by_production_validator"
            "tools::web_fetch::tests::test_redirect_to_cloud_metadata_is_blocked"
            "tools::web_fetch::tests::test_max_redirect_hops_enforced"
            "tools::web_fetch::tests::test_relative_redirect_resolves_against_current_url"
            "tools::web_fetch::tests::test_scheme_relative_redirect_revalidated"
            # The private-address guard moved to koda-sandbox (`url_guard`).
            "url_guard::tests::test_is_safe_url_blocks_metadata"
            "url_guard::tests::test_is_safe_url_blocks_private_ips"
            "url_guard::tests::test_is_safe_ip_blocks_private"
            # ── file_tools symlink / TOCTOU confinement (#1283) ──────────
            "tools::file_tools::tests::write_file_refuses_symlink_escaping_project_root"
            "tools::file_tools::tests::write_file_refuses_symlinked_parent_dir_escaping_project_root"
            "tools::file_tools::tests::edit_file_refuses_symlink_escaping_project_root"
            # (The Delete tool's symlink test left with the tool, #1564: an
            # `rm` runs in Bash, confined by the sandbox tests below.)
            # ── MCP transport SSRF ─────────────────────────────────────
            # koda-mcp's own test binary (`koda-mcp/tests/http_transport.rs`).
            "mcp_client_connect_rejects_loopback_ssrf"
            # ── sandbox path confinement (worker / fs / workspace) ────────
            "worker::tests::write_outside_root_is_denied"
            "worker::tests::symlink_escape_is_denied"
            "fs::policy::tests::rejects_path_outside_every_root"
            # ── sandbox spawn-with-policy integration (`#[cfg(unix)]`) ─────
            "unix::spawn_with_policy_write_outside_root_is_denied"
            "unix::spawn_with_policy_symlink_escape_is_denied"
            # ── Koda's shared server (koda-sandbox/tests/server_socket.rs) ─
            "a_sandboxed_command_cannot_reach_the_server"
            "another_path_to_the_socket_is_closed_too"
            "moving_a_folder_above_the_socket_does_not_open_it"
          )
          missing=()
          for t in "${required_tests[@]}"; do
            # \Q...\E would be cleaner but grep -E doesn't speak it.
            # Test names contain only [A-Za-z0-9_:] so plain interpolation
            # is safe — no regex metachars to escape.
            if ! grep -qE "<testcase name=\"${t}\" [^>]*/>" target/nextest/ci/junit.xml; then
              missing+=("$t")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required security-boundary tests did not run on ${{ runner.os }}:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "These tests guard SSRF, symlink/TOCTOU, and sandbox path-escape boundaries."
            echo "If one was renamed, update the list. If one was intentionally removed,"
            echo "document why on #1265 before deleting from this guard."
            exit 1
          fi
          echo "✓ All ${#required_tests[@]} security-boundary tests ran on ${{ runner.os }}."

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
        with:
          shared-key: doc  # stable across branches & workflow edits
          # PRs restore main's cache but don't save their own: a PR's cache
          # can only be read by that PR, and seven of them per PR pushed the
          # repo past GitHub's 10 GB limit, evicting main's (2026-11-15).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Audit gating: on pull_request, cargo audit runs only when the PR
  # changes a dependency manifest. A PR that leaves them alone can't add
  # or fix an advisory, so a newly published RustSec advisory against
  # main's existing Cargo.lock must not turn unrelated PRs red. Weekly
  # audit.yml catches those on main and files a `security-audit` issue.
  #
  # The check stays required because auto-merge-dependabot.yml merges
  # every Dependabot PR once required checks pass; dependency PRs must
  # not merge unaudited. So the skip is step-level: the job always runs
  # and reports success. Never move this to a workflow-level `paths:`
  # filter (a required check that never reports blocks merge forever)
  # or to a job-level `if:` fed by another job (if that job fails, this
  # one is skipped, and a skipped required check counts as passing).
  #
  # push to main and workflow_call from a non-PR caller always audit.
  # github.event_name is the caller's event under workflow_call, so a
  # PR-triggered caller gets the same gating as a PR here.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On pull_request this checks out GitHub's test-merge commit
          # (refs/pull/N/merge): first parent = base branch tip, second
          # parent = PR head. Depth 2 fetches both parents, so diffing
          # against the first parent shows exactly what the merge changes.
          fetch-depth: 2
      - name: Decide whether to audit
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event '$EVENT': auditing unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: without a test-merge commit, HEAD^1 would be the
          # PR's own previous commit and the diff would silently shrink.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::Expected the pull_request test-merge commit at HEAD (two parents)."
            exit 1
          fi
          changed=$(git diff --name-only 'HEAD^1' HEAD)
          deps=$(printf '%s\n' "$changed" | grep -E '(^|/)Cargo\.(toml|lock)$|^\.cargo/audit\.toml$' || true)
          if [ -n "$deps" ]; then
            echo "Dependency manifests changed; auditing:"
            printf '%s\n' "$deps" | sed 's/^/  /'
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Security Audit skipped::No Cargo.lock, Cargo.toml or .cargo/audit.toml change in this PR. main is audited weekly by audit.yml."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      # A prebuilt cargo-audit: `cargo install` compiled it from source each
      # time a cache missed. It reads Cargo.lock and builds nothing, so the
      # job needs no Rust cache.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        if: steps.scope.outputs.run == 'true'
        with:
          tool: cargo-audit
      - name: Run audit
        if: steps.scope.outputs.run == 'true'
        run: cargo audit --deny unsound --deny yanked

  # The desktop app (apps/desktop): its type check, unit tests and build
  # always, which take seconds and need no Rust. Its test against a real
  # `koda serve` needs a koda build, so on a PR it runs only when the PR
  # changes what that test exercises: the app, the protocol, the client and
  # server crates or this file. Step-level, as in `audit`, so the job always
  # reports. Electron's own binary isn't downloaded: nothing here runs it.
  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the test-merge commit's two parents, as in `audit`
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/desktop/.node-version
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Decide whether to test against koda serve
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::Expected the pull_request test-merge commit at HEAD (two parents)."
            exit 1
          fi
          changed=$(git diff --name-only 'HEAD^1' HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(apps/desktop/|docs/src/protocol-schema\.json$|koda-protocol/|koda-client/|koda-server/|koda-cli/src/app\.rs$|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Desktop app::No change the koda serve test exercises; it runs on main and nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: 1.100.0 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.8.1
        if: steps.scope.outputs.run == 'true'
        with:
          # The Linux test job's cache, which holds this debug build; that
          # job saves it on main, so this one never does.
          shared-key: ci-Linux
          save-if: false
      - name: Build koda
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        run: cargo build -p koda-cli
      - name: Test against koda serve
        if: steps.scope.outputs.run == 'true'
        run: npx vitest run tests/koda-serve.test.ts
        env:
          KODA_BIN: ${{ github.workspace }}/target/debug/koda

  # The one check main's ruleset needs, as Codex's `CI required`: the list of
  # what must pass lives here, in review, instead of in the repo's settings,
  # so a job added above is required once it's listed in `needs`.
  required:
    name: CI required
    # Without always(), a failed job would skip this one, and a skipped
    # required check counts as passing.
    if: always()
    needs: [fmt, clippy, check, test, doc, audit, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Not every CI job succeeded:"
            echo "$failed"
            exit 1
          fi
          echo "✓ Every CI job succeeded."
