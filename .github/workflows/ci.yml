name: CI

on:
  pull_request:
    branches: [main]    # PR status checks
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features koda-core/test-support -- -D warnings

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (all targets, no features)
        # Catches cfg-gated items invisible behind feature flags AND
        # platform-specific compile errors (e.g. std::os::unix on Windows).
        run: cargo check --workspace --all-targets

  test:
    name: Test
    needs: [lint, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features koda-core/test-support

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit || true  # Advisory-only, don't fail CI

  docs-size:
    name: Docs Chapter Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check chapter sizes
        run: |
          # Guard against individual doc chapters growing unbounded.
          # Each docs/src/*.md chapter is capped at 8 192 bytes (~2 K tokens).
          # At this cap, the full embedded blob stays under ~144 KB even if
          # every chapter simultaneously hits the limit — still acceptable for
          # an infrequently activated skill.
          #
          # SUMMARY.md is the mdBook table of contents and grows naturally as
          # chapters are added — it is excluded from this gate.
          #
          # To raise the cap: bump MAX_BYTES and explain why in the commit
          # message (e.g. "commands.md now covers sub-commands — 10 KB needed").
          MAX_BYTES=8192
          FAILED=0
          for f in docs/src/*.md; do
            [ "$(basename "$f")" = "SUMMARY.md" ] && continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "❌  $f: ${size}B exceeds cap of ${MAX_BYTES}B"
              FAILED=1
            else
              printf "✅  %-45s %5dB\n" "$f" "$size"
            fi
          done
          exit $FAILED

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: koda-core coverage (≥ 80% lines)
        run: |
          # --test-threads=1: compact::test_circuit_breaker mutates global
          # atomic state; concurrent sibling tests can re-trip the circuit
          # between reset_compact_failures() and the assertion.
          cargo llvm-cov \
            --lib -p koda-core \
            --features koda-core/test-support \
            --fail-under-lines 80 \
            --lcov --output-path lcov-core.info \
            -- --test-threads=1
      - name: koda-ast coverage (≥ 80% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-ast \
            --fail-under-lines 80 \
            --lcov --output-path lcov-ast.info
      - name: koda-email coverage (≥ 70% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-email \
            --fail-under-lines 70 \
            --lcov --output-path lcov-email.info
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        if: always()   # Upload even on failure so you can inspect regressions
        with:
          name: lcov-reports
          path: lcov-*.info
          retention-days: 7
