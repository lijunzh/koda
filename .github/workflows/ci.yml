name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features koda-core/test-support -- -D warnings
      - name: Check (no features)
        # Catches cfg-gated items invisible behind feature flags.
        run: cargo check --workspace --all-targets

  test:
    name: Test (${{ matrix.sandbox }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - sandbox: with-bwrap
            install_bwrap: true
          - sandbox: no-bwrap
            install_bwrap: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-support
      - name: Install bubblewrap (sandbox backend)
        if: matrix.install_bwrap
        run: sudo apt-get install -y bubblewrap
      - name: Test
        run: cargo test --workspace --features koda-core/test-support

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc  # stable across branches & workflow edits
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit || true  # Advisory-only, don't fail CI


