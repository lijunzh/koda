name: CI

on:
  pull_request:
    branches: [main]    # PR status checks
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --features koda-core/test-support

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features koda-core/test-support -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features koda-core/test-support

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: koda-core coverage (≥ 80% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-core \
            --features koda-core/test-support \
            --fail-under-lines 80 \
            --lcov --output-path lcov-core.info
      - name: koda-ast coverage (≥ 80% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-ast \
            --fail-under-lines 80 \
            --lcov --output-path lcov-ast.info
      - name: koda-email coverage (≥ 70% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-email \
            --fail-under-lines 70 \
            --lcov --output-path lcov-email.info
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        if: always()   # Upload even on failure so you can inspect regressions
        with:
          name: lcov-reports
          path: lcov-*.info
          retention-days: 7

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit || true  # Advisory-only, don't fail CI
