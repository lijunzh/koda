name: CI

on:
  pull_request:
    branches: [main]    # PR status checks
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features koda-core/test-support -- -D warnings
      - name: Check (no features)
        # Compile every target without optional features to catch cfg-gated
        # items that are invisible when a feature flag is absent.  This is
        # what caught the missing [[test]] / required-features stanza for
        # e2e_safety_test (fixes #737) — CI always ran with
        # --features koda-core/test-support so the gap was never visible.
        run: cargo check --workspace --all-targets

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features koda-core/test-support

  doc:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  audit:
    name: Security Audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit || true  # Advisory-only, don't fail CI

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: koda-core coverage (≥ 80% lines)
        run: |
          # --test-threads=1: compact::test_circuit_breaker mutates global
          # atomic state; concurrent sibling tests can re-trip the circuit
          # between reset_compact_failures() and the assertion.
          cargo llvm-cov \
            --lib -p koda-core \
            --features koda-core/test-support \
            --fail-under-lines 80 \
            --lcov --output-path lcov-core.info \
            -- --test-threads=1
      - name: koda-ast coverage (≥ 80% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-ast \
            --fail-under-lines 80 \
            --lcov --output-path lcov-ast.info
      - name: koda-email coverage (≥ 70% lines)
        run: |
          cargo llvm-cov \
            --lib -p koda-email \
            --fail-under-lines 70 \
            --lcov --output-path lcov-email.info
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        if: always()   # Upload even on failure so you can inspect regressions
        with:
          name: lcov-reports
          path: lcov-*.info
          retention-days: 7
