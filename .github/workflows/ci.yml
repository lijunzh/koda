name: CI

on:
  push:
    branches: [main]    # Catch post-merge config drift on protected branch
  pull_request:
    branches: [main]
  workflow_call:        # Called by other workflows

permissions:
  contents: read        # Least-privilege for all jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# ── Job topology ─────────────────────────────────────────────────────────────
#
# Each job has ONE responsibility (Zen of Python: "There should be one — and
# preferably only one — obvious way to do it.") so PR check labels surface
# exactly what broke without grepping the log:
#
#   fmt     → formatting
#   clippy  → lints + compile WITH test-support features (full lint surface)
#   check   → compile sanity WITHOUT features (what crates.io users see)
#   test    → behaviour, matrix on (ubuntu, macos)
#   doc     → doc compile + intra-doc links + -Dwarnings
#   audit   → dependency advisories (on PRs, only when deps change)
#
# All jobs run in parallel; wall-clock is gated by the slowest (test ≈ 3min).
#
# Why both `clippy` and `check`? They run with different feature sets:
#   - clippy enables `koda-core/test-support` (covers the full code surface)
#   - check uses no features (validates the crates.io shape)
# This works only because koda-core has zero `#[cfg(not(feature = "..."))]`
# code today. If that changes, clippy will stop covering the no-features
# path and you'll want a second clippy run with --no-default-features.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml (pin guarded in ci.yml)
          components: rustfmt
      # No rust-cache — fmt doesn't compile anything. Skipping cache saves
      # the ~10s setup overhead and keeps the job at ~30s end-to-end.
      - run: cargo fmt --all --check
      # #1109 F2 guard: every #[tokio::test] in modules that touch
      # tokio::spawn / BgAgentRegistry / sub-agent dispatch / watch /
      # broadcast must use flavor="multi_thread". Pure text scan, ~1s,
      # rides the fmt job because it's the cheapest place that already
      # has a checkout. Bash port (#1328 follow-up: kept the
      # everything-in-Rust workspace free of one-off Python scripts).
      - name: Check tokio test flavor (#1109 F2)
        run: scripts/check_tokio_test_flavor.sh

      # #1328 self-pin: the Test step below MUST keep `shell: bash`
      # to enable pipefail. Without pipefail, `cargo test ... | tee`
      # observes only tee's exit code (always 0), so test failures
      # are silently swallowed and the bwrap-assertion downstream
      # takes the blame. This grep guards against accidental
      # removal in future edits. Cheap (~50ms) and lives in the
      # workflow file it's protecting — zero new files, zero new
      # languages.
      - name: Pin pipefail on Test step (#1328)
        run: |
          if ! awk '/- name: Test$/{flag=1; next} flag && /shell: bash$/{found=1; exit} flag && /^      - name:/{exit} END{exit !found}' .github/workflows/ci.yml; then
            echo "::error::Test step in ci.yml is missing 'shell: bash' (#1328)."
            echo "Without it, GH Actions defaults to 'bash -e {0}' (no pipefail),"
            echo "and 'cargo test ... | tee' silently swallows cargo's exit code."
            echo "Re-add 'shell: bash' on the line directly above 'run: cargo test'."
            exit 1
          fi

      # Toolchain pin guard: every dtolnay/rust-toolchain step in every
      # workflow must install exactly the channel pinned in
      # rust-toolchain.toml. A step without a `toolchain:` input falls
      # back to floating `stable`, which is how rustc 1.99's new clippy
      # lints turned CI red with no code change. Pure text scan, ~50ms.
      - name: Check toolchain pin
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$pinned" ]; then
            echo "::error::rust-toolchain.toml has no channel line."
            exit 1
          fi
          drift=$(awk -v want="$pinned" '
            function report() {
              if (got != want) print loc " installs " (got == "" ? "floating stable (no toolchain input)" : got)
              open = 0
            }
            FNR == 1 && open { report() }
            /uses: dtolnay\/rust-toolchain@/ { if (open) report(); open = 1; got = ""; loc = FILENAME ":" FNR; next }
            open && /^ *- / { report() }
            open && /^ *toolchain:/ { got = $2; gsub(/"/, "", got) }
            END { if (open) report() }
          ' .github/workflows/*.yml)
          if [ -n "$drift" ]; then
            echo "::error::Workflow toolchain drifts from rust-toolchain.toml ($pinned):"
            echo "$drift"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml (pin guarded in ci.yml)
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: clippy-Linux
      - run: cargo clippy --workspace --all-targets --features koda-core/test-support -- -D warnings

  check:
    name: Check (no features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: check-Linux
      # Catches cfg-gated items invisible behind feature flags. This is the
      # crates.io consumer build — koda-core ships without test-support.
      - run: cargo check --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: ci-${{ runner.os }}
      - name: Set up Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          # Hardened install: Azure Ubuntu mirrors (azure.archive.ubuntu.com)
          # periodically fail DNS resolution from GH Actions runners, blocking
          # CI on a transient infra issue unrelated to the change under test.
          # Retry with exponential backoff up to 5 times (max ~2.5 min) before
          # giving up. See https://github.com/lijunzh/koda/pull/1179 for the
          # failure mode that motivated this.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y bubblewrap; then
              echo "bubblewrap installed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::apt-get install bubblewrap failed after 5 attempts (Azure mirror unreachable?)"
              exit 1
            fi
            delay=$((15 * attempt))
            echo "::warning::apt-get install attempt $attempt/5 failed; retrying in ${delay}s"
            sleep $delay
          done
          # Enable unprivileged user namespaces so bwrap can sandbox.
          # GH Actions runners disable this by default.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # Ubuntu 24.04+ additionally gates userns behind AppArmor.
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        # CRITICAL: `shell: bash` is load-bearing here. Without it,
        # GH Actions defaults to `bash -e {0}` (errexit only, NO
        # pipefail). With pipefail off, `cargo test ... | tee`
        # observes only `tee`'s exit code (always 0), so any
        # non-zero from cargo is silently swallowed and the step
        # appears green even when tests failed. The downstream
        # bwrap-assertion guard then takes the blame for the missing
        # tests — a 30-min wild goose chase every time it happens.
        # See #1328 for the post-mortem (PR #1326 CI run 25471442843,
        # PR #1330 CI run 25497008448 — both blamed bwrap when the
        # real failure was upstream in koda-core).
        #
        # Setting `shell: bash` makes GH Actions invoke as
        # `bash --noprofile --norc -eo pipefail {0}` per its docs:
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#defaultsrunshell
        shell: bash
        run: cargo test --workspace --features koda-core/test-support 2>&1 | tee test-output.log
        # `tee` keeps live streaming for the GH log AND captures output
        # for the assertion step below. We pipe stderr to stdout because
        # cargo test prints test names to stderr in some configurations.
      # #1104: regression guard — fail CI if the bwrap SEC-002 / TOCTOU
      # tests didn't actually run. Without this, a future cfg-gate or
      # test-binary split could silently exclude them and we'd only
      # find out by getting hacked. Linux-only: bwrap is gated to
      # `target_os = "linux"`.
      - name: Assert bwrap SEC-002 regression tests ran (#1104)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          required_tests=(
            git_config_deny_pre_creates_for_non_git_dir_to_close_toctou
            git_config_deny_adds_ro_bind_for_existing_git_dir
            git_config_deny_skips_worktree_gitdir_pointer
            git_config_deny_preserves_existing_config_mtime
          )
          missing=()
          for t in "${required_tests[@]}"; do
            if ! grep -qE "test bwrap::tests::${t} \.\.\. ok" test-output.log; then
              missing+=("$t")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required bwrap regression tests did not run:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ All ${#required_tests[@]} bwrap SEC-002/TOCTOU regression tests ran."

      # #1265 item 8b: fail-closed guard for security-boundary tests.
      # Same shape as the bwrap check above, broadened to every
      # security-critical test across web_fetch (SSRF + redirect),
      # file_tools (symlink/TOCTOU), MCP transport (SSRF), and
      # sandbox (path confinement). Without this guard, a future
      # `#[cfg(...)]`, `#[ignore]`, or test-binary split could
      # silently exclude any of these and we'd only learn from a CVE.
      #
      # Cross-platform: every test below runs on both ubuntu-latest
      # and macos-latest. Linux-only or macos-only tests stay out of
      # this list (the bwrap step above handles Linux-only).
      - name: Assert security-boundary tests ran (#1265 item 8b)
        run: |
          set -euo pipefail
          # Each entry is a fully-qualified `cargo test` path as it
          # appears on a `test ... ok` line in the log. The full path
          # (not just the function name) is intentional: it pins the
          # test to its module, so renaming a fn that happens to
          # collide with a test name elsewhere can't accidentally
          # satisfy the check.
          required_tests=(
            # ── web_fetch SSRF + redirect (#1282) ────────────────────────
            "tools::web_fetch::tests::test_web_fetch_blocks_ssrf"
            "tools::web_fetch::tests::test_redirect_to_loopback_is_blocked_by_production_validator"
            "tools::web_fetch::tests::test_redirect_to_cloud_metadata_is_blocked"
            "tools::web_fetch::tests::test_max_redirect_hops_enforced"
            "tools::web_fetch::tests::test_relative_redirect_resolves_against_current_url"
            "tools::web_fetch::tests::test_scheme_relative_redirect_revalidated"
            "tools::web_fetch::tests::test_is_safe_url_blocks_metadata"
            "tools::web_fetch::tests::test_is_safe_url_blocks_private_ips"
            "tools::web_fetch::tests::test_is_safe_ip_blocks_private"
            # ── file_tools symlink / TOCTOU confinement (#1283) ──────────
            "tools::file_tools::tests::write_file_refuses_symlink_escaping_project_root"
            "tools::file_tools::tests::write_file_refuses_symlinked_parent_dir_escaping_project_root"
            "tools::file_tools::tests::edit_file_refuses_symlink_escaping_project_root"
            "tools::file_tools::tests::delete_file_refuses_symlink_escaping_project_root"
            # ── MCP transport SSRF ─────────────────────────────────────
            "mcp_client_connect_rejects_loopback_ssrf"
            # ── sandbox path confinement (worker / fs / workspace) ────────
            "worker::tests::write_outside_root_is_denied"
            "worker::tests::symlink_escape_is_denied"
            "fs::policy::tests::rejects_path_outside_every_root"
            # ── sandbox spawn-with-policy integration (`#[cfg(unix)]`) ─────
            "unix::spawn_with_policy_write_outside_root_is_denied"
            "unix::spawn_with_policy_symlink_escape_is_denied"
          )
          missing=()
          for t in "${required_tests[@]}"; do
            # \Q...\E would be cleaner but grep -E doesn't speak it.
            # Test names contain only [A-Za-z0-9_:] so plain interpolation
            # is safe — no regex metachars to escape.
            if ! grep -qE "^test ${t} \.\.\. ok\$" test-output.log; then
              missing+=("$t")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required security-boundary tests did not run on ${{ runner.os }}:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "These tests guard SSRF, symlink/TOCTOU, and sandbox path-escape boundaries."
            echo "If one was renamed, update the list. If one was intentionally removed,"
            echo "document why on #1265 before deleting from this guard."
            exit 1
          fi
          echo "✓ All ${#required_tests[@]} security-boundary tests ran on ${{ runner.os }}."

      # macOS-only: `ClonefileProvider` (and its tests) live behind
      # `#[cfg(target_os = "macos")]` because `clonefile(2)` is an APFS
      # syscall. Split into its own step so the cross-platform list
      # stays runner-agnostic.
      - name: Assert macOS-only sandbox tests ran (#1265 item 8b)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          required_tests=(
            "workspace::tests::clonefile::release_refuses_path_outside_clones_root"
          )
          missing=()
          for t in "${required_tests[@]}"; do
            if ! grep -qE "^test ${t} \.\.\. ok\$" test-output.log; then
              missing+=("$t")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required macOS-only security-boundary tests did not run:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ All ${#required_tests[@]} macOS-only security-boundary tests ran."

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: doc  # stable across branches & workflow edits
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Audit gating: on pull_request, cargo audit runs only when the PR
  # changes a dependency manifest. A PR that leaves them alone can't add
  # or fix an advisory, so a newly published RustSec advisory against
  # main's existing Cargo.lock must not turn unrelated PRs red. Weekly
  # audit.yml catches those on main and files a `security-audit` issue.
  #
  # The check stays required because auto-merge-dependabot.yml merges
  # every Dependabot PR once required checks pass; dependency PRs must
  # not merge unaudited. So the skip is step-level: the job always runs
  # and reports success. Never move this to a workflow-level `paths:`
  # filter (a required check that never reports blocks merge forever)
  # or to a job-level `if:` fed by another job (if that job fails, this
  # one is skipped, and a skipped required check counts as passing).
  #
  # push to main and workflow_call from a non-PR caller always audit.
  # github.event_name is the caller's event under workflow_call, so a
  # PR-triggered caller gets the same gating as a PR here.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # On pull_request this checks out GitHub's test-merge commit
          # (refs/pull/N/merge): first parent = base branch tip, second
          # parent = PR head. Depth 2 fetches both parents, so diffing
          # against the first parent shows exactly what the merge changes.
          fetch-depth: 2
      - name: Decide whether to audit
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event '$EVENT': auditing unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: without a test-merge commit, HEAD^1 would be the
          # PR's own previous commit and the diff would silently shrink.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::Expected the pull_request test-merge commit at HEAD (two parents)."
            exit 1
          fi
          changed=$(git diff --name-only 'HEAD^1' HEAD)
          deps=$(printf '%s\n' "$changed" | grep -E '(^|/)Cargo\.(toml|lock)$|^\.cargo/audit\.toml$' || true)
          if [ -n "$deps" ]; then
            echo "Dependency manifests changed; auditing:"
            printf '%s\n' "$deps" | sed 's/^/  /'
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Security Audit skipped::No Cargo.lock, Cargo.toml or .cargo/audit.toml change in this PR. main is audited weekly by audit.yml."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml (pin guarded in ci.yml)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        if: steps.scope.outputs.run == 'true'
      - name: Install cargo-audit
        if: steps.scope.outputs.run == 'true'
        run: cargo install cargo-audit --locked
      - name: Run audit
        if: steps.scope.outputs.run == 'true'
        run: cargo audit --deny unsound --deny yanked
