name: Vendor sync reminder

# Why this exists
# ───────────────
# We vendor a small set of files from `openai/codex` (mostly the composer
# textarea + supporting modules). Each vendored file carries a provenance
# doc-comment like:
#
#     //! Ported from `codex-rs/tui/src/bottom_pane/textarea.rs` at upstream
#     //! commit `d55479488e125ef7a0a8584505d839a22eaf6204`
#
# This workflow checks once a week whether upstream has touched any of those
# files since the pinned SHA. If — and only if — there is real drift, it
# files a single GitHub issue with the per-file breakdown so a human can
# decide whether to re-port.
#
# Design choices (per Lijun's feedback on the audit thread):
#   • No issue is filed when there is zero drift. We do not train people to
#     ignore weekly noise.
#   • If a `vendor-sync` issue is already open, we skip — don't pile on.
#   • The pinned SHAs live in the source files themselves, not a separate
#     manifest. One source of truth, no synchronization to keep up.
#   • The list of vendored files is hardcoded below. There are 6 of them
#     and they change roughly never; auto-discovery would be more code than
#     it saves.

on:
  schedule:
    # Mondays at 09:00 America/Chicago = 14:00 UTC (15:00 during CST).
    # Picking a fixed UTC time is fine; an hour of drift across DST is not
    # worth solving.
    - cron: '0 14 * * 1'
  workflow_dispatch:  # also runnable on demand from the Actions tab

permissions:
  contents: read
  issues: write       # needed to file the reminder issue

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Clone upstream codex
        # Full history so `git log <pinned>..HEAD -- <path>` works for any
        # pinned SHA, however old. `--filter=blob:none` skips file content
        # we don't need (we only read commit metadata).
        run: git clone --filter=blob:none https://github.com/openai/codex.git ../codex

      - name: Compute drift
        id: drift
        run: |
          set -euo pipefail

          # Mapping: local koda path → upstream codex path.
          # Update this list when adding/removing vendored files.
          #
          # Path note: upstream paths reflect codex's CURRENT layout, not
          # the layout at our pinned SHA. We pass `--follow` to `git log`
          # below so renames between pin and HEAD are traced correctly
          # (e.g. `keymap.rs` was at `bottom_pane/` at our original pin
          # and lives at `tui/src/` today; `--follow` connects the two).
          # If you re-pin to a SHA that predates a rename, leave the
          # mapping pointing at the file's CURRENT location.
          declare -A FILES=(
            ["koda-cli/src/composer/textarea.rs"]="codex-rs/tui/src/bottom_pane/textarea.rs"
            ["koda-cli/src/composer/keymap.rs"]="codex-rs/tui/src/keymap.rs"
            ["koda-cli/src/composer/key_hint.rs"]="codex-rs/tui/src/key_hint.rs"
            ["koda-cli/src/composer/paste_burst.rs"]="codex-rs/tui/src/bottom_pane/paste_burst.rs"
            ["koda-cli/src/composer/text_element.rs"]="codex-rs/protocol/src/user_input.rs"
            ["koda-cli/src/composer/wrapping.rs"]="codex-rs/tui/src/wrapping.rs"
            # #1325 Phase 1: peer-agent message-passing substrate.
            #
            # `koda-core/src/agent/inter_agent.rs` is intentionally NOT
            # registered here even though it's vendored — its upstream
            # source is `codex-rs/protocol/src/protocol.rs`, a 4000-line
            # file that churns weekly for unrelated reasons. Whole-file
            # drift detection would drown the report. The header in
            # `inter_agent.rs` documents how to check for symbol-level
            # drift manually (one `git log -G InterAgentCommunication`
            # invocation).
            ["koda-core/src/agent/path.rs"]="codex-rs/protocol/src/agent_path.rs"
            ["koda-core/src/agent/mailbox.rs"]="codex-rs/core/src/agent/mailbox.rs"
          )

          report=""
          skipped_report=""
          total_drift=0
          total_skipped=0
          warnings=0

          for local_path in "${!FILES[@]}"; do
            upstream_path="${FILES[$local_path]}"

            # Pull the first 40-char hex string out of the provenance comment.
            # Every vendored file currently has exactly one such SHA at the top.
            sha=$(grep -oE '[a-f0-9]{40}' "$local_path" | head -1 || true)

            if [[ -z "$sha" ]]; then
              report+="| \`${local_path}\` | ⚠️ **no pinned SHA found** | — |"$'\n'
              warnings=$((warnings + 1))
              continue
            fi

            # Verify the SHA actually exists upstream. If it doesn't, the
            # provenance comment is stale or wrong — surface it loudly.
            if ! git -C ../codex cat-file -e "${sha}^{commit}" 2>/dev/null; then
              report+="| \`${local_path}\` | ⚠️ **pinned SHA \`${sha:0:10}\` not found upstream** | — |"$'\n'
              warnings=$((warnings + 1))
              continue
            fi

            # Extract intentionally-skipped commit SHAs from the file's
            # `## Vendor-sync skips` section. Format: `//! - skip <SHA>: <reason>`
            # where SHA is 7-40 hex chars. Build an alternation pattern for
            # `grep -E` to filter the git log output below.
            skip_shas=$(grep -oE '^//!\s*-\s*skip\s+[a-f0-9]{7,40}' "$local_path" | grep -oE '[a-f0-9]{7,40}' || true)
            skip_pattern=""
            if [[ -n "$skip_shas" ]]; then
              skip_pattern=$(echo "$skip_shas" | paste -sd '|' -)
            fi

            # All upstream commits that touched the file since the pin.
            # `--follow` is critical: without it, a rename between pin and
            # HEAD silently hides all drift. Discovered the hard way on
            # 2026-05-05 when `keymap.rs` moved from `bottom_pane/` to
            # `tui/src/` upstream and the initial workflow reported 0
            # drift instead of 2 commits.
            all_log=$(git -C ../codex log --oneline --follow "${sha}..HEAD" -- "$upstream_path" 2>/dev/null || true)

            # Partition into drift (needs review) vs. intentionally skipped.
            # `git log --oneline` output starts with the abbreviated SHA, so
            # `^(prefix1|prefix2|...)` matches lines whose commit was skipped.
            if [[ -n "$skip_pattern" && -n "$all_log" ]]; then
              drift_log=$(echo "$all_log" | grep -vE "^(${skip_pattern})" || true)
              skipped_log=$(echo "$all_log" | grep -E "^(${skip_pattern})" || true)
            else
              drift_log="$all_log"
              skipped_log=""
            fi

            # Use `grep -c .` (not `wc -l`) so empty input correctly returns 0.
            count=$(echo "$drift_log" | grep -c . || true)
            skipped_count=$(echo "$skipped_log" | grep -c . || true)

            # Always surface skipped commits in their own report section so
            # humans can see what's been deferred and reconsider periodically.
            if [[ "$skipped_count" -gt 0 ]]; then
              skipped_short=$(echo "$skipped_log" | head -5)
              skipped_report+="| \`${local_path}\` | ${skipped_count} | <details><summary>show</summary>"$'\n\n'"\`\`\`"$'\n'"${skipped_short}"$'\n'"\`\`\`"$'\n'"</details> |"$'\n'
              total_skipped=$((total_skipped + skipped_count))
            fi

            if [[ "$count" -eq 0 ]]; then
              # File exists upstream and has no UNSKIPPED drift. Verify
              # upstream still has the file at all (catches renames).
              if ! git -C ../codex cat-file -e "HEAD:${upstream_path}" 2>/dev/null; then
                report+="| \`${local_path}\` | ⚠️ **upstream path missing at HEAD (renamed?)** | — |"$'\n'
                warnings=$((warnings + 1))
              fi
              # Otherwise: silent — clean files don't clutter the drift report.
              continue
            fi

            # Pull a short summary of upstream changes for the issue body.
            short_log=$(echo "$drift_log" | head -5)
            report+="| \`${local_path}\` | **${count} commit(s) behind** | <details><summary>show</summary>"$'\n\n'"\`\`\`"$'\n'"${short_log}"$'\n'"\`\`\`"$'\n'"</details> |"$'\n'
            total_drift=$((total_drift + count))
          done

          echo "total_drift=${total_drift}" >> "$GITHUB_OUTPUT"
          echo "total_skipped=${total_skipped}" >> "$GITHUB_OUTPUT"
          echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"

          # Multi-line outputs need the heredoc form.
          {
            echo "report<<EOF_VENDOR_REPORT"
            echo "$report"
            echo "EOF_VENDOR_REPORT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "skipped_report<<EOF_VENDOR_SKIPPED"
            echo "$skipped_report"
            echo "EOF_VENDOR_SKIPPED"
          } >> "$GITHUB_OUTPUT"

          echo "Total drift:   ${total_drift} commit(s) requiring review"
          echo "Total skipped: ${total_skipped} commit(s) intentionally not ported"
          echo "Warnings:      ${warnings}"

      - name: Skip when no drift and no warnings
        if: steps.drift.outputs.total_drift == '0' && steps.drift.outputs.warnings == '0'
        run: echo "✅ All vendored files are in sync with upstream. No issue filed."

      - name: Check for existing open vendor-sync issue
        if: steps.drift.outputs.total_drift != '0' || steps.drift.outputs.warnings != '0'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If a vendor-sync issue is already open, don't file a duplicate.
          # The human will close the existing one when they finish the work,
          # and the next scheduled run will refile if drift remains.
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label vendor-sync \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Existing open vendor-sync issue: #${existing}. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File vendor-sync reminder issue
        if: |
          (steps.drift.outputs.total_drift != '0' || steps.drift.outputs.warnings != '0')
          && steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.drift.outputs.total_drift }}
          SKIPPED: ${{ steps.drift.outputs.total_skipped }}
          WARNINGS: ${{ steps.drift.outputs.warnings }}
          REPORT: ${{ steps.drift.outputs.report }}
          SKIPPED_REPORT: ${{ steps.drift.outputs.skipped_report }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)

          # Title encodes the headline number so it's scannable from the
          # issue list without opening it. Skipped commits are excluded
          # from the headline — they're already-decided, not pending work.
          if [[ "$WARNINGS" -gt 0 ]]; then
            title="Vendor sync — ${DRIFT} commit(s) drift, ${WARNINGS} warning(s) (${today})"
          else
            title="Vendor sync — ${DRIFT} commit(s) of upstream drift (${today})"
          fi

          # Optionally append the skipped-commits section. Only show it
          # when something is skipped — otherwise it's noise.
          skipped_section=""
          if [[ -n "${SKIPPED_REPORT// /}" ]]; then
            skipped_section=$(cat <<EOF

          ## Intentionally skipped (${SKIPPED} commit(s))

          These upstream commits are explicitly NOT being ported. Each one
          is documented in the corresponding file's \`## Vendor-sync skips\`
          doc-comment section with a justification. Re-evaluate periodically
          — if the reason no longer holds (e.g. koda gained a missing
          dependency, or upstream's change became more compelling), delete
          the \`skip <SHA>\` line and re-port the commit.

          | File | Skipped | Commits |
          |------|---------|---------|
          ${SKIPPED_REPORT}
          EOF
          )
          fi

          body=$(cat <<EOF
          Weekly vendor-sync check found upstream drift in vendored codex files.

          ## Drift requiring review (${DRIFT} commit(s))

          | File | Status | Upstream commits since pin |
          |------|--------|-----------------------------|
          ${REPORT}
          ${skipped_section}

          ## How to act on this

          **For each commit listed above, ask: does this fit koda's needs?**
          Don't port blindly. Upstream codex is a different product with
          features koda doesn't have (\`/keymap\` slash command,
          \`codex-config\` crate integration, etc.) — commits that depend on
          that infrastructure are dead code on arrival here.

          A useful triage rubric:

          - **Bug fixes with no koda-only dependencies** → port them.
          - **Pure refactors** → usually port to keep merges clean.
          - **Features that depend on upstream-only infrastructure**
            (\`/keymap\`, codex-config, etc.) → skip with a justification.
          - **Platform-specific fixes for platforms koda doesn't actively
            support** (Windows-only behavior changes, etc.) → skip until
            koda picks up that platform.
          - **Large feature additions** → case-by-case; only port if koda
            wants the feature.

          ### To port a commit

          1. 3-way merge the upstream change into the vendored file, anchored
             at the file's currently-pinned SHA.
          2. Re-apply the koda-specific adaptations listed in that file's
             top doc-comment (module path swaps, ratatui API drift, etc.).
             See PR #1178 for prior art.
          3. Update the pinned SHA in the provenance comment to the SHA of
             the latest commit you ported (NOT necessarily upstream HEAD).

          ### To intentionally skip a commit

          Add a line to the file's \`## Vendor-sync skips\` doc-comment
          section in this exact format (the workflow greps for it):

          \`\`\`text
          //! - skip <abbreviated-SHA>: <subject> — <reason koda is skipping>
          \`\`\`

          The next workflow run will exclude the commit from the drift
          count and surface it in the "Intentionally skipped" section
          instead. Make the reason specific: "depends on \`/keymap\` UI we
          don't have" beats "don't want it."

          ### To close this issue

          Close when every commit in the drift table has been either ported
          or skip-annotated. The next scheduled run will refile only if NEW
          drift appears (e.g. upstream lands more commits).

          ## How this issue was generated

          \`.github/workflows/vendor-sync-reminder.yml\` runs every Monday
          and only files an issue when there is real drift (skipped commits
          excluded from the headline). If this issue is wrong or unhelpful,
          edit that workflow rather than ignoring the issue.
          EOF
          )

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --label vendor-sync \
            --label chore \
            --body "$body"
