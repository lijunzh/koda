[package]
name = "koda-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The engine of the Koda AI coding agent: the agent loop, tools, approval and compaction"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ai", "coding-agent", "llm", "engine", "unix"]
# crates.io permits up to 5 categories; surface the async + LLM-API
# nature so search lands the crate beyond just "development-tools".
categories = ["development-tools", "asynchronous", "api-bindings"]
authors.workspace = true

[lib]
name = "koda_core"
path = "src/lib.rs"

[dependencies]
# ugrep and bfs, which `koda` carries; search through the shell runs them
# (`shell_search`).
koda-search = { workspace = true }
# The git context at session start runs git outside the sandbox, hardened.
koda-git = { workspace = true }
# `@` mentions of images, read by the host.
base64 = { workspace = true }
# Read v2: scale and recompress a large image before it is sent.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Async runtime
tokio = { workspace = true, features = ["full"] }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# A private copy of a PDF for poppler to read (Read v2).
tempfile = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# File system (respects .gitignore)
ignore = { workspace = true }

# Path normalization
path-clean = "1"

# Text search
regex = { workspace = true }

# Diff computation
similar = "3"

# File globbing
glob = { workspace = true }

# URL parsing (for SSRF protection)
url = "2"
htmd = { workspace = true }

# Date/time — already in the tree via koda-cli and ratatui
time = { workspace = true }

# Unique IDs
uuid = { workspace = true }

# SHA-256 content hashing (edit staleness detection — Gemini CLI strategy)
sha2 = "0.10"

# Git blob ids in the turn diff's `index` lines, as Codex's
sha1 = "0.11"

# POSIX shell tokenization (bash safety classification — replaces substring matching, #807)
shlex = { workspace = true }

# Sync mutex without poisoning (#1022 B16: BgAgentRegistry needs
# a non-poisoning sync mutex to survive a panic-while-held without
# bricking every subsequent drain. parking_lot is also faster on
# contention and has a cleaner non-`Result` API).
parking_lot = "0.13"

# HTTP client (for LLM API)
reqwest = { workspace = true }

# Streaming support
futures-util = { workspace = true }

# Error handling
anyhow = { workspace = true }

# MCP client — connect to external MCP servers (#662)
rmcp = { version = "3", default-features = false, features = [
    "client",
    "base64",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# HTTP types (HeaderName, HeaderValue) for MCP HTTP transport headers
http = "1"

# First-party workspace libraries (direct calls)

# Sandbox runtime — kernel-level FS/net/exec policies (#934)
koda-config = { workspace = true }
koda-protocol = { workspace = true }
# Model providers and the model tables, re-exported as `providers`,
# `model_alias`, `model_context`, `model_effort` and `provider_catalog`.
koda-providers = { workspace = true }
# Shell command classification, re-exported as `bash_safety`,
# `bash_path_lint` and `tools::ToolEffect`.
koda-command = { workspace = true }
# The MCP client, re-exported as `mcp`.
koda-mcp = { workspace = true }
# Skills and memory, re-exported as `skills` and `memory`.
koda-memory = { workspace = true }
koda-skills = { workspace = true }
koda-sandbox = { workspace = true }
koda-state = { workspace = true }

# Async trait support
async-trait = { workspace = true }

# Cancellation tokens
tokio-util = { workspace = true }

[dev-dependencies]
# MCP HTTP integration test: rmcp server-side HTTP transport + axum
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "server-side-http",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tower-log"] }
koda-test-utils = { path = "../koda-test-utils" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
regex = { workspace = true }
ignore = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

# Integration tests are one binary, tests/all.rs.

[[bench]]
name = "assemble_context_bench"
harness = false
