[package]
name = "koda-core"
version = "0.2.17"
edition = "2024"
description = "Core engine for the Koda AI coding agent (macOS and Linux only)"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
homepage = "https://github.com/lijunzh/koda"
readme = "README.md"
keywords = ["ai", "coding-agent", "llm", "engine", "unix"]
categories = ["development-tools"]
authors = ["Lijun Zhu"]

[lib]
name = "koda_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# File system (respects .gitignore)
ignore = "0.4"

# Path normalization
path-clean = "1"

# Text search
regex = "1"

# Diff computation
similar = "3"

# File globbing
glob = "0.3"

# URL parsing (for SSRF protection)
url = "2"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Base64 encoding (for image support)
base64 = "0.22"

# SHA-256 content hashing (edit staleness detection — Gemini CLI strategy)
sha2 = "0.10"

# POSIX shell tokenization (bash safety classification — replaces substring matching, #807)
shlex = "1"

# Sync mutex without poisoning (#1022 B16: BgAgentRegistry needs
# a non-poisoning sync mutex to survive a panic-while-held without
# bricking every subsequent drain. parking_lot is also faster on
# contention and has a cleaner non-`Result` API).
parking_lot = "0.12"

# HTTP client (for LLM API)
reqwest = { version = "0.13", features = ["json", "stream"] }

# Streaming support
futures-util = "0.3"

# Error handling
anyhow = { workspace = true }

# MCP client — connect to external MCP servers (#662)
rmcp = { version = "1.4", default-features = false, features = [
    "client",
    "base64",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# HTTP types (HeaderName, HeaderValue) for MCP HTTP transport headers
http = "1"

# First-party workspace libraries (direct calls)

# Sandbox runtime — kernel-level FS/net/exec policies (#934)
koda-sandbox = { path = "../koda-sandbox" }

# Async trait support
async-trait = { workspace = true }

# Cancellation tokens
tokio-util = { workspace = true }

[features]
test-support = []

[dev-dependencies]
insta = { workspace = true }
# MCP HTTP integration test: rmcp server-side HTTP transport + axum
rmcp = { version = "1.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "server-side-http",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tower-log"] }
tower = "0.5"
koda-test-utils = { path = "../koda-test-utils" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
regex = "1"
ignore = "0.4"
anyhow = { workspace = true }
async-trait = { workspace = true }

# Integration tests that need mock infrastructure.
# Run with: cargo test -p koda-core --features test-support
[[test]]
name = "e2e_test"
required-features = ["test-support"]

[[test]]
name = "e2e_agent_test"
required-features = ["test-support"]

[[test]]
name = "e2e_skills_test"
required-features = ["test-support"]

[[test]]
name = "e2e_tools_test"
required-features = ["test-support"]

[[test]]
name = "cancel_test"
required-features = ["test-support"]

[[test]]
name = "inference_recovery_test"
required-features = ["test-support"]

[[test]]
name = "inference_edge_test"
required-features = ["test-support"]

[[test]]
name = "e2e_safety_test"
required-features = ["test-support"]

[[test]]
name = "session_test"
required-features = ["test-support"]
