[package]
name = "koda-sandbox"
version = "0.2.25"
edition.workspace = true
rust-version.workspace = true
description = "Capability-aware sandbox layer for Koda — kernel-enforced FS/net/exec policies (refs #934)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sandbox", "security", "filesystem", "unix", "ai"]
categories = ["os", "filesystem", "concurrency"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
# File globbing for `LocalFileSystem::glob`. Same version as koda-core.
glob = "0.3"
# Recursive walk + .gitignore handling for `LocalFileSystem::grep`.
# Same version as koda-core.
ignore = "0.4"
# Regex matching for `LocalFileSystem::grep`. Same version as koda-core.
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "io-util", "io-std", "net", "macros", "fs", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Linux-only: stage-2 helper binary uses raw syscalls (ioctl for `lo`,
# prctl for parent-death, execvp). Tokio's tiny libc dep is not
# enough — we want the public surface so it's a direct workspace dep.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# macOS needs libc for clonefile(2) used by ClonefileProvider (Phase 4d).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[[bin]]
name = "koda-fs-worker"
path = "src/bin/koda-fs-worker.rs"

# Linux-only stage-2 helper for the bwrap kernel-enforced egress proxy
# (Phase 3c.1 of #934). Spawned by `BwrapRuntime` as the bwrap entry
# point; sets up the in-netns TCP↔UDS local bridge then `execvp`s into
# the user's command.
[[bin]]
name = "koda-sandbox-stage2"
path = "src/bin/koda-sandbox-stage2.rs"
required-features = []

# Phase 4g of #934: prove the pool hits the < 15 ms p95 warm gate.
# Unix-only because SandboxPool depends on WorkerClient (UnixStream).
[[bench]]
name = "acquire_slot"
harness = false
required-features = []

# Phase 4g of #934: 30-parallel sub-agent demo + ClonefileProvider
# vs GitWorktreeProvider comparison. Also reports the signal data
# that drives the deferred 4e/4f decisions.
[[bench]]
name = "parallel_dispatch"
harness = false
required-features = []
