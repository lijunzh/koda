[package]
name = "koda-sandbox"
version = "0.1.0"
edition = "2024"
description = "Capability-aware sandbox layer for Koda — kernel-enforced FS/net/exec policies (refs #934)"
license = "MIT"
repository = "https://github.com/lijunzh/koda"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
# File globbing for `LocalFileSystem::glob`. Same version as koda-core.
glob = "0.3"
# Recursive walk + .gitignore handling for `LocalFileSystem::grep`.
# Same version as koda-core.
ignore = "0.4"
# Regex matching for `LocalFileSystem::grep`. Same version as koda-core.
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "io-util", "io-std", "net", "macros", "fs", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[[bin]]
name = "koda-fs-worker"
path = "src/bin/koda-fs-worker.rs"
