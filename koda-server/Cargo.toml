[package]
name = "koda-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The host of the Koda AI coding agent: the server end of its client protocol"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["ai", "coding-agent", "json-rpc", "server"]
categories = ["development-tools"]

[dependencies]
koda-config = { workspace = true }
koda-state = { workspace = true }
koda-core = { workspace = true }
koda-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util", "net"] }
tracing = { workspace = true }
uuid = { workspace = true }
# feedback/save: the ZIP, written through a temp file, as Codex writes its own.
tempfile = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
anyhow = { workspace = true }

# `koda serve`'s socket: the user's own id, for its folder and its peers.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
koda-test-utils = { path = "../koda-test-utils" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
